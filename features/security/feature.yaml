# feature.yaml — pipeline configuration for Security
# All feature-specific constants live HERE; shared scripts read this file
# and contain no per-feature literals. Regenerate nothing by editing code.
#
# 本表之 `workbook.*` 為 R-G1 母本
# （forms/FM-WI-FSM-036-A01 …_SWQT_20260817_ext.xlsx）第 9 列之實測值
# （R-G48，2026-09-05 量測）。**接手 feature 仍須對其副本重測** ——
# 母本實測不代表副本；副本之欄序得因 ext 而異。

feature: "Security"

# R-SEC10(a)：Layer 1 案 A —— 一本 workbook、六個 Test Group（＝元件名）。
# 舊模板之單值 `test_group: "Security"` 作廢。
workbook_count: one
test_group:
  CertProvider:   "Cert Provider"
  KeyInstall:     "Key Install"
  SAM:            "SAM"
  ECUCert:        "ECU Cert"
  SwdlSecureLib:  "SWDL Secure Lib"
  libLogEncrypt:  "Log Encrypt"

# R-SEC10(b)：TC ID `NR1L-{ABBR}-{nnn}`，六組各自 001 升冪；batch 1 先占號，batch 2 接續。
abbr:
  CertProvider:   "CP"
  KeyInstall:     "KI"
  SAM:            "SAM"
  ECUCert:        "ECUC"
  SwdlSecureLib:  "SWDL"
  libLogEncrypt:  "LOGENC"

# R-SEC10(c)：`specification_reference` = `{037 token}_{SWE1-ID}`。
# token = 檔名去副檔名、去前綴 `FM-WI-FSM-037-A03-N1L-`、去尾綴 ` STLA 報告_SWRA STLA Report_SWRA`、空白→底線。
# 六值已由執行層逐檔複驗（SEC-02 上繳包）。
spec_ref_tokens:
  CertProvider:   "SWE1-CertProvider-SWE1R1-V1.0"
  KeyInstall:     "SWE1-KeyInstall-SWE1R1-V1.0"
  SAM:            "SWE1-SAM-SWE1R1-V1.1"
  ECUCert:        "SWE1_ECUCert_FM-WI-FSM-037-A03"
  SwdlSecureLib:  "SWE1_SwdlSecureLib_FM-WI-FSM-037-A03"
  libLogEncrypt:  "SWE1_libLogEncrypt_FM-WI-FSM-037-A03"

# R-G66 來源集中制：原檔在 `sources/raw/<doc_id>/`，本 feature 不存副本（`inputs/` 空）。
# 下列為 doc_id，非路徑；sha256 見 `sources/MANIFEST.tsv`（features 欄含 `security`）。
paths:
  workbook: "forms/FM-WI-FSM-036-A01 STLA 測試用例規範與結果_SWQT STLA Test Case Specification & Result_SWQT_20260817_ext.xlsx"  # R-G1 母本
  a03_reports:                       # 六本 037，母體（R-SEC1(a)）
    - swe1_037_certprovider_v1_0
    - swe1_037_keyinstall_v1_0
    - swe1_037_sam_v1_1
    - swe1_037_ecucert
    - swe1_037_swdlsecurelib
    - swe1_037_liblogencrypt
  sys1_export: null                  # 本 feature 無 SYS1 HMI 匯出
  spec_pdf: null
  popup_list: null                   # 無 HMI 入口，無 popup
  sysad:                             # SYS3，追溯素材
    - sys3_sysad_certprovider_vf
    - sys3_sysad_keyinstall_vd
    - sys3_sysad_sam_a02
    - sys3_sysad_ecucert_a01
    - sys3_sysad_swdl_a01
    - sys3_sysad_liblogencrypt_a01
  sys2: sys2_cfts084_sysra_newreq_0331
  polarion_export: swe1_certprovider_polarion   # 僅 CertProvider 一本（R-SEC9；其餘 DR-SEC-s）

# R-SEC10(d)：新型別 `F` —— 037-SWRA 母體，錨走 spec_ref_tokens ＋ SWE1-ID。
spec_mode: "F"
spec_reference_template: "{token}_{swe1_id}"

workbook:
  # R-G48：以下為母本第 9 列實測。2026-09-05 前之模板值有四處為誤 ——
  # sheet `Test Case Specification&Result`（該名不在 R-G1 母本內；惟為另一真實變體，
  # 全 repo 145 本 FW036 工作簿實測 24 本帶該名，含 features/power 之在效輸入 ——
  # docs/reports/tc_sheetname_census_20260905.tsv，A-GC10；接手 feature 必實測其副本之 sheetnames）、design_method `Q`
  # （實為 R；Q 為 Estimated Test Time）、functional_safety `R`（實為 S）、
  # author `Z`（實為 AA；Z 為車型欄 Fastack (376)）。
  sheet: "Test Case Specification 測試用例規範"
  header_row: 9
  # column letters, verified by recon header match — do not guess
  columns:
    req_id: "D"
    test_group: "G"
    test_set: "H"
    test_item: "I"
    pre_conditions: "J"
    input_test_data: "K"
    test_procedure: "L"
    expected_result: "M"
    spec_reference: "N"
    tc_ref_id: "O"
    priority: "P"
    design_method: "R"
    functional_safety: "S"
    author: "AA"
    remarks: "AH"      # verify at recon; dropping it drops BLOCKED notes

done_region:
  # detection: "author" (author-cell match) or "rows" (explicit ranges)
  detection: "author"
  author_value: "Arif"
  # invariant: "content_hash" (interleaved-safe) or "positional"
  invariant: "content_hash"

write_back:
  author_value: "PeiPYHsu"
  tc_ref_id_value: "NEW"
  fill_test_group_set: false     # true only under BLANK per FO §2

lint:
  design_method_source: "dropdown_sheet"   # exact-string vocabulary
  popup_ids: []                            # e.g. [PU0091, PU0942] — verbatim check
  extra_rules: []                          # feature-specific lint hooks
