# feature.yaml — pipeline configuration for Bed Lowering Mode
# 全部 feature 專屬常數集中於此；共用腳本讀本檔，不含 per-feature literal。
#
# 來源：下放包 02（features/bed_lowering/docs/handoff/02_wiring_workbook.md）§二。
# **本檔之形制與該 §二 之草案不同**，差異與其依據逐項見 A-BLM6／A-BLM7；
# 摘要：§二 之草案為扁平鍵（slug／profile／form_template／spec_pdf…），
# 而 `scripts/feature_config.py` 之 `load_feature_config()` 讀
# `cfg["workbook"]["columns"]` 與 `cfg["paths"]`，草案形制會以 KeyError 中止。
# 本檔依實際 loader 形制落檔，並逐鍵標明其消費者。
#
# 未實測者一律留 null／TBD，不猜（沿 vehicle_category 之檔頭慣例）。

feature: "Bed Lowering Mode"        # R-BLM1
test_group: "Bed Lowering Mode"     # R-BLM1，工作簿 G 欄

# R-BLM1：FROP 為上游功能推出計畫之歸屬，非 repo 之 feature 切分。
# 記於此保留該事實；不進入 test_group、不進入任何 TC 欄位。
# 實測：037 之 FROP 欄 218/218 列皆為 "Vehicle Settings"，相異值數 1。
# 本鍵之 py 消費者為 0 —— 沿 vehicle_category 之同名鍵慣例保留為事實登記，
# 非供腳本讀取（R-VC9 之例外，其理由即「保留該事實」本身）。
frop: "Vehicle Settings"

paths:
  # R-G1 全域母本之工作副本。**與 forms/ 原件逐位元相同**
  # （cmp 全等，sha256 6372fb6b…825b2），故非「另存」而是複製。
  # 母本 R 欄 design_method 之下拉為 x14 擴充，openpyxl 存回即摧毀
  # （R-G1 註／A-UP09）；本副本自始未經 openpyxl 存回。
  workbook: "workbook/bed_lowering_00.xlsx"
  a03_report: "inputs/FM-WI-FSM-037-A03-N1L-SWE1-BedLoweringMode-HMI-V0.1 STLA 報告.xlsx"
  sys1_export: "inputs/SYS1_HMI_Bed_Lowering_Mode_HMI_Logic_and_Flow_R1_SR24_1A_(June_21_2021).xlsx"
  # R-BLM4：無後手標註之原始輸出。spec-index/sources/ 之同名檔不得取用。
  spec_pdf: "inputs/Bed Lowering Mode HMI Logic and Flow R1 SR24 1A (June 21 2021).pdf"

# 037 之 `Analysis Report` 分頁存在且命名標準，intake sniffer 正常命中
# （下放包 01 §一-4）。本 feature 不需 intake.kind_overrides，
# 亦不需 paths_meta.a03_sheet（取預設 "Analysis Report"）。

# **R-BLM7（Pei 2026-08-26 裁定，回應 A-BLM7）：採 D。**
# D = "looked up, never constructed"（FO §3）。三者中唯一自洽：
#   A 建不起來 —— 其 outline map 需 037 `HMI Source ID` ∩ SYS1
#     `SYSRE_HMI_Source ID`，實測為空（A-BLM4）；
#   B 技術可行（PDF 文字層 21/21 頁、8,157 字元、平均 388/頁）但會為批次語料
#     引入第二真相源，而 037 每 leaf 已帶完整 Requirement Description；
#   D 與 R-BLM5 已裁之行為同族（null 編碼，R-VC8）。
# 後果：批次語料取 `data/leaf_inventory.tsv`（037 側）；
# **規格 PDF 降為人讀參考，不入 prompt 語料。**
# 下放包 02 §二 之 "hmi_logic_and_flow" 作廢 —— FO §3 值域為單一字母 A–E。
spec_mode: "D"

# R-BLM5：spec_reference 為**查得**（逐字抄 037 `HMI Source ID` 欄），非構造。
# `null` 為本管線既有之「查得而不構造」編碼，非新增枚舉 ——
# `scripts/recon.py:915` 之 R-VC8 註明載：鍵存在且為 null 時，
# 該欄取 037 citation 之逐字值。R-BLM5 自陳與 R-VC4 為同一條文，
# 而 R-VC4 於 vehicle_category/feature.yaml 之編碼即為 null。
#
# ⚠ 下放包 02 §二 填 `literal_037_hmi_source_id`。**該值不可用**（A-BLM6）：
# 它不會被拒絕，而會落入 `tpl.replace("{outline}", sec)` 之構造分支；
# 因該字串不含 `{outline}`，replace 為 no-op，結果是 176 列之 N 欄
# 全部寫入字面字串 "literal_037_hmi_source_id"。**不中止、不報錯。**
spec_reference_template: null

workbook:
  sheet: "Test Case Specification 測試用例規範"   # 本包實測自副本
  header_row: 9                                   # 本包實測自副本
  # 下列字母為本包自 `bed_lowering_00.xlsx` 第 9 列表頭實測所得，
  # 非自他 feature 轉錄。recon.py 之表頭解析與之不符時會逐項報衝突。
  columns:
    no: "B"
    req_id_polarion: "C"
    req_id: "D"
    tc_id_testrail: "E"
    tc_id: "F"
    test_group: "G"
    test_set: "H"
    test_item: "I"
    pre_conditions: "J"
    input_test_data: "K"
    test_procedure: "L"
    expected_result: "M"
    spec_reference: "N"
    tc_ref_id: "O"
    priority: "P"
    estimated_test_time: "Q"
    design_method: "R"
    functional_safety: "S"
    author: "AA"
    test_version: "AB"

# TC ID 之格式（IN §10.3 `{project}-{abbr}-{NNN}`）。
# 鍵名沿 amfm 之既有 `tc_id_format`（`newR1L-AMFM-{n:03d}`）——
# 下放包 07 §二-2 稱「project 前綴依 feature.yaml」，而本檔原無任何 project 鍵；
# 全案之 project 前綴為 `newR1L`，其權威為工作簿 D2 儲存格（本包實測 = "newR1L"），
# amfm 交付本之 `newR1L-AMFM-001…143` 為既有實例。不另立 `project:` 裸鍵，
# 因為真正被讀的是完整格式字串，拆成兩鍵會多一個無人讀的鍵（R-VC9）。
tc_id_format: "newR1L-BLM-{n:03d}"

done_region:
  detection: "author"
  author_value: null            # R-BLM3：workbook_state = BLANK，本節不生效
  invariant: "content_hash"

write_back:
  author_value: "PeiPYHsu"
  tc_ref_id_value: "NEW"
  fill_test_group_set: true     # R-BLM3：BLANK -> FILL

lint:
  design_method_source: "dropdown_sheet"
  popup_ids: []
  extra_rules: []

# 只宣告 `recon.py` 之 run_assertions() 真正實作之鍵（R-VC9）。
# 實作之三鍵為 functional_requirement_count／distinct_spec_sections／
# spec_reference_stem；本檔宣告其中兩鍵 ——
# `distinct_spec_sections` **不宣告**，因本包未實測其值，
# 而宣告一個未實測之期望值等同製造一個假的保護。
recon_assertions:
  # 本包實測：037 218 資料列中，Categorization=="Functional Requirement"
  # 者 176，且與「req_id 帶 -NN 尾碼」之判準 176/176 完全重合。
  functional_requirement_count: 176
  # R-BLM5 之基線。實測：037 `HMI Source ID` 相異值數 = 1。
  spec_reference_stem: "SYS1_HMI_Bed_Lowering_Mode_HMI_Logic_and_Flow_R1_SR24_1A_(June_21_2021)"

# R-G15（RULINGS_LEDGER 版）：其變動會使既有產出失效者一律綁定。
