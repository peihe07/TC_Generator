# R-G19（FO 讀法）批次指紋之來源宣告。未宣告則 prompt_fingerprint.py 取
# 慣例預設（IN + backend/prompt_builder.py）。本 feature 明文宣告，因為
# **預設之一在本批未被使用**：pilot 批之 TC 由 Claude Code session 依 canon
# 直接撰寫，未經 `backend/prompt_builder.py` 組 prompt、未呼叫
# `backend/generator.py`。把一個未參與生成之檔列入指紋，會讓它的變動看起來
# 影響產出、而它的不變看起來是保證 —— 兩者都不實。
#
# 實際拘束本批產出者為下列五源：canon、profile、framework、裁決、批次語料。
