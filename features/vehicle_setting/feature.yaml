# feature.yaml — pipeline configuration for Vehicle Setting
# All feature-specific constants live HERE; shared scripts read this file
# and contain no per-feature literals. Regenerate nothing by editing code.

feature: "Vehicle Setting"
test_group: "Vehicle Setting"          # framework-internal; workbook write per profile

# 本 feature 含兩份交付（R-VS60）：
#   Part 1 = CFTS044 —— 既有交付，本區塊之鍵一律不得更動
#   Part 2 = VF230    —— 61 包進場，鍵一律以 `_vf230` 具名結尾
# `workbook` / `a03_report` / `sys1_export` / `spec_pdf` 四個無後綴鍵
# **保留指向 CFTS044**（61 包 §4.1 之「擇一」取前者），既有腳本與
# recon.py 之預設路徑因而不變。VF230 之消費者一律取具名鍵。
paths:
  workbook: "inputs/FM-WI-FSM-036-A01 STLA 測試用例規範與結果_SWQT STLA Test Case Specification & Result_SWQT_CFTS044_Vehicle Controls_20260819.xlsx"
  # 本 feature 之 037 散落四份（R-VS4）；recon 取 Common Features 為代表，
  # leaf 全集以 data/leaves.tsv 為準（W-2，271 leaf）
  a03_report: "inputs/FM-WI-FSM-037-A03_SWE1_CFTS044 STLA 報告_SWRA STLA Report_SWRA_Common Features.xlsx"
  sys1_export: "inputs/SYS2  R1LR_Atl-H_25PI1.1_Activation and Configuration_CFTS_044_Vehicle Controls_SR26_20250815-1022_20260324_Version3_Released.xlsx"
  spec_pdf: "inputs/R1LR_Atl-H_25PI3.5_Activation and Configuration_CFTS_044_Vehicle Controls_SR26_20250909-1816.docx"
  popup_list: null   # CFTS044 對 Pop Up 命中 0（00A DR-5c 撤回）

  # --- Part 1 = CFTS044（具名別名，值與上列無後綴鍵逐字相同）---
  workbook_cfts044: "inputs/FM-WI-FSM-036-A01 STLA 測試用例規範與結果_SWQT STLA Test Case Specification & Result_SWQT_CFTS044_Vehicle Controls_20260819.xlsx"

  # --- Part 2 = VF230（61 包進場）---
  workbook_vf230: "inputs/FM-WI-FSM-036-A01 STLA 測試用例規範與結果_SWQT STLA Test Case Specification & Result_SWQT_VF230_20260819.xlsx"
  # VF230 之 037 散落 11 份；此鍵取 leaf 數最多者為代表（131 leaf），
  # leaf 全集以 data/vf230_leaves.tsv 為準（627 leaf，R-VF16；
  # 其中 8 列標 disagree=1，見 A-VS132）。
  # 每個 paths 鍵須恰好 glob 到 1 檔（feature_config.resolve_path），
  # 故 11 份不得以單鍵表達。
  a03_report_vf230: "inputs/FM-WI-FSM-037-A03_SWE1_VF230_STLA 報告_SWRA_STLA_Trailer_Name - Max_Power_Level_Report.xlsx"
  # 副檔名為 `.doc`，內容實為 OOXML（`Microsoft Word 2007+`），
  # python-docx 直讀，未轉檔（推翻 61 包 §6 第 2 項之前提）
  spec_pdf_vf230: "inputs/C-VF230_V1_R5_PDT27.doc"
  # VF230 之 SYS2 ICS export 缺件 —— DR-28 未覆前為 null，不得代用 CFTS044 之
  # SYS2（其為該 CFTS 專屬）。原生檔已於
  # `9_ASPICE/SYS.2 …/Z.QS YuShen 260423/08.[SYS2]Vehicle Settings/SYS2_VF230.xlsx`
  # 尋得，惟未補入（R-VS61）且缺 6 個 E-Save leaf。
  sys1_export_vf230: null
  # 跨源驗核之實際來源（A-VS134）：其 `Basic Report` 與 SYS2 export 同型，
  # 且涵蓋 037 之全部 745 列。DR-28 之「無第二來源可核」因之作廢。
  sysra_vf230: "inputs/FM-WI-FSM-035-A02_VF230_HDCC_DT_STLA 技術安全需求分析報告_SYSRA STLA Technical Safety Requirement Analysis Report_SYSRA_VF230_V4_Released.xlsx"
  # 內容與 spec_pdf_vf230 之 `.doc` 逐字相同（A-VS125 之複驗），保留僅為留痕
  spec_docx_vf230: "inputs/C-VF230_V1_R5_PDT27.docx"

  # SYSAD 於 VF230 交付夾內之副本與 inputs/ 既有者 sha256 相同
  # （469162b8…，61 包 W-102 實測），不重複複製

spec_mode: "D"        # A/B/C/D/E per FEATURE_ONBOARDING §3（00 包 W-12）
spec_reference_template: "<Spec Filename>_{outline}"

workbook:
  sheet: "Test Case Specification 測試用例規範"   # 實測分頁名，非模板值
  header_row: 9
  # 表頭列 9 之 34 欄（B–AH）於兩本 workbook 逐欄相同（61 包 §2.2），
  # 故 `columns` 共用；僅 VF230 另有 `seq`（見 profiles.vf230）
  # column letters, verified by recon header match — do not guess
  columns:
    req_id: "D"
    test_group: "G"
    test_set: "H"
    test_item: "I"
    pre_conditions: "J"
    input_test_data: "K"
    test_procedure: "L"
    expected_result: "M"
    spec_reference: "N"
    tc_ref_id: "O"
    priority: "P"
    design_method: "R"      # 實測：Q 為 Estimated Test Time
    functional_safety: "S"
    author: "AA"           # 實測：Z 為 Fastack (376) Atl-Mi
    remarks: "AH"      # verify at recon; dropping it drops BLOCKED notes

done_region:
  # detection: "author" (author-cell match) or "rows" (explicit ranges)
  detection: "author"
  author_value: "Arif"
  # invariant: "content_hash" (interleaved-safe) or "positional"
  invariant: "content_hash"

write_back:
  author_value: "PeiPYHsu"
  tc_ref_id_value: "NEW"
  fill_test_group_set: false     # true only under BLANK per canon §2

lint:
  design_method_source: "dropdown_sheet"   # exact-string vocabulary
  popup_ids: []                            # e.g. [PU0091, PU0942] — verbatim check
  extra_rules: []                          # feature-specific lint hooks

# --- 逐交付之覆寫（無後綴鍵為 CFTS044 之值；此處僅列相異者）---
# 消費者以交付別（cfts044 / vf230）取用；未列之鍵一律沿用上方共用值。
# ⚠ **本段現無任何消費者**（R-VF117；A-VF31）——
# `scripts/feature_config.py:resolve_path()` 直接取 `paths.<key>`，**不經 profile**。
# 各線改為**直讀具名鍵**（如 VF230 之寫回 dry-run 直讀 `paths.workbook_vf230`）。
# **本註記使其閒置可見，而非使其消失** —— 其與實際行為之分岔無任何檢查在管。
profiles:
  cfts044:
    workbook: "workbook_cfts044"
    a03_report: "a03_report"
    leaves: "data/leaves.tsv"

  vf230:
    workbook: "workbook_vf230"
    a03_report: "a03_report_vf230"
    leaves: "data/vf230_leaves.tsv"
    crosscheck: "sysra_vf230"        # 跨源驗核之來源（A-VS134）
    # R-VS59 —— B 欄「No.#/序號」自 238 起連續遞增。
    # 該映射**僅對 VF230 生效**；CFTS044 之 B 欄（1–237）為凍結欄，
    # 任何寫回不得觸及，故 cfts044 profile 不設 seq。
    columns:
      seq: "B"
    seq_start: 238
    seq_basis: "CFTS044 交付路徑之 036，列 10-246，B 欄末值 = 237（61 包 §2.3 實測）"
    # 進場時 0 非空資料列（61 包 §2.2 實測）——
    # leaf 母體來自 037，非來自 036；覆蓋率於 P1 無分母，不報（§4.5）
    workbook_state_at_intake: "BLANK"
    # R-VF9（Pei 裁定 2026-08-23）：Test Group 為 `Vehicle Setting`，
    # CFTS044 與 VF230 兩本 workbook 同值。本條明示排除 spec L1 Heading
    # （`Vehicle Setup Management [VF230_V1_]`）與 037 Sub Categorization
    # 之眾數（`Vehicle Setting Management (VSM)`），亦明示排除 R-C6 於本案之適用。
    test_group: "Vehicle Setting"

# VS-SL-07 §1（R-VS94）：R-G42 二之 ABBR 宣告。
# `lint_delivery_spec.py` 二令 F 欄為 `NR1L-{ABBR}-{nnn}` 且 ABBR = 本鍵；
# 未宣告即判紅。本輪之前全庫無任一 feature 宣告本區塊。
delivery:
  tc_id_abbr: VS
