# feature.yaml — pipeline configuration for Display
# All feature-specific constants live HERE; shared scripts read this file
# and contain no per-feature literals. Regenerate nothing by editing code.

feature: "Display"
test_group: "Display"          # framework-internal; workbook write per profile

paths:
  workbook: "inputs/FM-WI-FSM-036-A01 STLA 測試用例規範與結果_SWQT STLA Test Case Specification & Result_SWQT_20260817_ext.xlsx"   # R-G1 母本；sha256 6372fb6b…
  a03_report: "inputs/Display_Management_FM-WI-FSM-037-A03_STLA_Report_SWRA.xlsx"   # R-DM2′；intake.py sniffer 誤判為 spec_xlsx（R-DM5(a)），故本行為人工填入
  sys1_export: "inputs/SYS2_CFTS_020_DISP_TCH_ICS_20260616_All_HW_System_Accepted & Released.xlsx"        # null if spec_mode has no export
  spec_pdf: "inputs/R1LR_Atl-H_26PI1.5 Mar Release-Cabin_CFTS_020 ICS and DCSD _20260310-1533.docx"   # CFTS 本文；spec_mode D 之判讀基準
  sys3_sysad: "inputs/SYS3_CFTS_020_display_FM-WI-FSM-011-A01_System Architectural Design_SYSAD_v1.0.docx"   # 追溯/架構參考，非判讀基準（intake.py A-TM10 未填入）
  popup_list: "inputs/Pop Up List HMI R1 (26PI).xlsx"   # PU0517／PU0130 之值域來源
  popup_priority_matrix: "inputs/Pop Up List Priority Matrix HMI R1 SR24 1A (May 3 2021).pdf"   # 仲裁順序（DR-DM2 之併讀對象）
  # 注意：`paths:` 之基準為本 feature 目錄，`reference:` 之基準為 repo 根。
  # 兩節之路徑寫法不同不是筆誤 —— 首次宣告時我把 forms/ 之 repo 相對路徑
  # 填進 paths:，recon.py 隨即以 `input not found ... under features/display`
  # 中止。素材依既有慣例（同 home 之 popup_list）複製入 inputs/。

# R-G15（2026-08-24，全域）：參考資料庫之版本綁定。逐項記檔名與 SHA256，
# 使跨 feature 之版本差異可見 —— vehicle_setting 用 LID v1_76、display 用
# v1_78，在本節出現前沒有任何條文在追這件事。
# 選定依據見 R-DM19（B-CAN = BHCAN2，Pei 2026-08-24 指示並親自置檔）。
# 檔案本身不入 git（R-G12）；台帳見 forms/FORMS.md。
reference:
  dbc_b:
    file: "forms/PDT27_E2A_R1_BHCAN2.dbc"
    sha256: "46cb73f3db62ac9fba6ad8010d7930661983faf01383c022c52ba3c37de1cc60"
  dbc_fd:
    file: "forms/PDT27_E2A_R1_FDCAN8.dbc"
    sha256: "2a86c4bf3e670d71b362d430b446d8d157c74b94429e833362f81f4a48f6a22e"
  lid:
    file: "forms/Logical Identifiers and CAN Mapping v1_78.xlsx"
    sha256: "a01e1679c706cd454daf82573a732fe5ad5eedb3865083897cb18c970b312433"
  proxi:
    file: "forms/PROXI_HDCC27_R3_20250424.xlsx"
    sha256: "e7c2020f01c3d58db431babe7f8a41acbe528c451bd37ef6bb84f1b312be6ff2"
  # R-DM37：036 母本是**寫回之標的** —— 其欄位配置一旦改變，
  # workbook.columns 之 15 個鍵、B 欄公式（R-DM15）、Q 欄之版面判準
  # （R-DM34(a)）全部受影響。故納入 reference: 之檢查範圍。
  # 判準不是「它是不是參考資料庫」，是「它變了以後我們的東西還對不對」。
  workbook_master:
    file: "forms/FM-WI-FSM-036-A01 STLA 測試用例規範與結果_SWQT STLA Test Case Specification & Result_SWQT_20260817_ext.xlsx"
    sha256: "6372fb6be02f48dc3a3e091a60d2e2b3cf26d8704c27e25d79b7c9516fb825b2"
  # R-DM38：`inputs/` 之四份素材同樣符合 R-DM37 之判準（其變動會使既有
  # 產出失效）—— 037 決定 leaf 全集與 recon_assertions 之 8；SYS2 決定
  # 80 列母體、15 個訊號、13 個值 token 與整份覆蓋對照；CFTS_020 為
  # spec_mode D 之判讀基準與 glossary 13 條之出處；SYS3 為 glossary 之
  # DPU 一條之出處。其 sha256 原僅記於 data/materials_ledger.tsv 而無腳本
  # 比對 —— 即 R-G23 所指之「宣告不等於保護」。
  #
  # `paths:` 與 `reference:` 之分工：
  #   paths:      記「檔在哪」（供腳本開檔）
  #   reference:  記「檔是哪一份」（供 verify_reference_binding.py 比對）
  # 同一個檔出現在兩節不是重複，是兩個不同的問題。
  a03_report:
    file: "features/display/inputs/Display_Management_FM-WI-FSM-037-A03_STLA_Report_SWRA.xlsx"
    sha256: "ab3198e81fb21d2182f5dd7a665488aac5eb937481cf6bede9ecc668f3185050"
  sys2_export:
    file: "features/display/inputs/SYS2_CFTS_020_DISP_TCH_ICS_20260616_All_HW_System_Accepted & Released.xlsx"
    sha256: "421c8eef3f5cb01a2d4d4768b41d38897009c53cdfdff2ff1b6ab80ba72adb1d"
  cfts_doc:
    file: "features/display/inputs/R1LR_Atl-H_26PI1.5 Mar Release-Cabin_CFTS_020 ICS and DCSD _20260310-1533.docx"
    sha256: "8696d1f596e3367754b092ff6d810cccff6258f46d6e90f8c0b30864314a30f3"
  sys3_sysad:
    file: "features/display/inputs/SYS3_CFTS_020_display_FM-WI-FSM-011-A01_System Architectural Design_SYSAD_v1.0.docx"
    sha256: "be9c97af0211a70357d4484fcfbd19b72d3d439ff28e7d09a11dda3146b3c298"
  # 19 包步驟 7（R-DM38 之判準）：PU0517／PU0130 之 timeout 與 category
  # 直接進 TC 之 Input Test Data 與 Expected Result，故此二檔之變動會使
  # 既有產出失效 —— 納入綁定。
  popup_list:
    file: "features/display/inputs/Pop Up List HMI R1 (26PI).xlsx"
    sha256: "ff47b7be63e5824cafe35deda9f9ddd0a63f6ea458169ef73689a1c559ea13ea"
  popup_priority_matrix:
    file: "features/display/inputs/Pop Up List Priority Matrix HMI R1 SR24 1A (May 3 2021).pdf"
    sha256: "dc078763c67b52388eba8edf5c461515cfd2d92dd3a78dba0ce4e365e43ccc2f"

# R-DM24（Q5 定案 B，Pei 2026-08-25）：以人工指定 kind 取代放寬共用分類器。
# `scripts/intake.py` 之 SHEET_SIGNATURES 一字未動；覆寫僅在下列 sha256
# 與該檔實際雜湊相符時生效，不符則不套用並警示（不得靜默略過）。
intake:
  kind_overrides:
    "Display_Management_FM-WI-FSM-037-A03_STLA_Report_SWRA.xlsx":
      kind: a03_report
      reason: "R-DM5: no 'Analysis Report' sheet; sheets are SWE1 Requirements / SYS2 Traceability / Excluded NRLs (HW-only)"
      sha256: "ab3198e81fb21d2182f5dd7a665488aac5eb937481cf6bede9ecc668f3185050"

# R-DM24 之後續（選項 D，Pei 2026-08-25 授權）：037 之需求分頁名不是
# `Analysis Report`。`scripts/recon.py` 之 survey_a03() 已改為讀本節，
# 未宣告者取預設 "Analysis Report"，故其他 feature 行為不變。
paths_meta:
  a03_sheet: "SWE1 Requirements"

spec_mode: "D"        # A/B/C/D/E per FO §3
spec_reference_template: null   # mode D：spec_reference 為查得，非構造（canon §3）

workbook:
  sheet: "Test Case Specification 測試用例規範"   # 實測自母本；模板之 rev A/B 名在本母本不存在
  header_row: 9
  # column letters, verified by recon header match — do not guess
  #
  # R-DM15：B 欄（`No.#`）為公式欄，B10-B1411 逐列為
  # `=IF(ISBLANK($D{row}),"",ROW()-9)`（1402/1402 實測）。
  # 寫回一律不得對 B 欄賦值 —— 序號由 D 欄（req_id）之填寫自動產生。
  # B 欄不列於 columns，即無鍵可寫；本註為防日後有人補上。
  # 另：B10 之 data_only 快取值為陳舊之 `1`（D10 為空，公式應回 ""），
  # 以快取值判斷「該列已填」會誤判 r10（A-DM12）。
  #
  # R-DM34(a)：Q 欄 `Estimated Test Time (mins)` 為版面 revision 標記
  # （有此欄 = rev C），**非管線欄位**。recon.py 會解出 estimated_test_time=Q，
  # 但本表不列它，寫回一律不觸碰。
  #
  # 「辨識但不寫入」之欄共兩個，理由不同，故分列：
  #   B 欄  公式欄（R-DM15）—— 賦值會摧毀 1402 列之 =IF(ISBLANK($D…))
  #   Q 欄  版面標記（R-DM34(a)）—— 賦值會把一個 revision 判準變成資料
  columns:
    req_id: "D"
    test_group: "G"
    test_set: "H"
    test_item: "I"
    pre_conditions: "J"
    input_test_data: "K"
    test_procedure: "L"
    expected_result: "M"
    spec_reference: "N"
    tc_ref_id: "O"
    priority: "P"
    design_method: "R"      # 實測；母本 Q 欄為 Estimated Test Time
    functional_safety: "S"  # 實測
    author: "AA"            # 實測；母本 Z 欄為 Fastack (376) Atl-Mi
    remarks: "AH"      # verify at recon; dropping it drops BLOCKED notes

done_region:
  # detection: "author" (author-cell match) or "rows" (explicit ranges)
  detection: "author"     # workbook_state = BLANK：無 done region，本節不生效
  author_value: null      # BLANK：無既有作者
  # invariant: "content_hash" (interleaved-safe) or "positional"
  invariant: "content_hash"

write_back:
  author_value: "PeiPYHsu"
  tc_ref_id_value: "NEW"
  fill_test_group_set: true      # workbook_state = BLANK -> FILL（canon §2.1）

lint:
  design_method_source: "dropdown_sheet"   # exact-string vocabulary
  popup_ids: []                            # e.g. [PU0091, PU0942] — verbatim check
  extra_rules: []                          # feature-specific lint hooks

# R-DM36：已裁常數宣告於此，使其於每次 recon.py 執行時被機器比對，
# 而非靠注意力維持。PASS 證明的是「該值仍未改變」，不是「該值是對的」——
# 其正確性來自上繳 09 §4 之交叉檢查。
#
# 只宣告一項。distinct_spec_sections 與 spec_reference_stem 不宣告：
# 本 feature 之 sections 為 0、citation_stems 為空（src_i 被 forbid 排除），
# 宣告必然為 0 之 assertion 只會製造一個不可能失敗之檢查（canon §5a）。
#
# **Q2 若裁為選項 B 或 C 而 leaf 母體改變，須改本值並記其理由；
#   靜默更新 assertion 等同取消該 assertion。**
recon_assertions:
  functional_requirement_count: 8
