# feature.yaml — pipeline configuration for Audio_Mgmt
# All feature-specific constants live HERE; shared scripts read this file
# and contain no per-feature literals. Regenerate nothing by editing code.
#
# 本檔之值一律回溯至 docs/handoff/01_intake_recon.md §三（R-AM1–R-AM7，
# Pei 2026-08-26 裁）與 docs/handoff/03_batch_B1_handoff.md。未經裁定者
# 標 [PROPOSED]，依 FEATURE_ONBOARDING §4：簽核時未動即成定案。

feature: "Audio Management"
test_group: "Audio Management"    # framework.md Layer 1；03 包 §二「Test Group 欄一律 Audio Management」

# 四件來源之檔名為 **inputs/ 之實際檔名**（2026-08-26 實測），非 01/03 包
# 所記之正規化寫法 —— 兩者在點/連字號/空白處不同，照包抄則 resolve_path
# 全部 glob 到 0 檔。見 A-AM01。
# feature_config.resolve_path 要求每鍵恰好 glob 到 1 檔，故兩本 CFTS 錨源
# 不得以單鍵表達 —— 比照 vehicle_setting 之具名後綴鍵慣例（R-VS60 型）。
paths:
  # R-AM3：BLANK 起建。此鍵指向 R-G1 母本之複本，非既存 AudioAACP 舊簿。
  # [BLOCKED] 母本尚未複入 inputs/ —— 03 包 §一只列了四件，漏列此第五件。
  # 母本在 repo forms/ 下，但 resolve_path 之 glob 基準為本 feature 目錄，
  # 故必須複製一份進 inputs/，不能跨目錄指涉。
  workbook: "inputs/FM-WI-FSM-036-A01 STLA 測試用例規範與結果_SWQT STLA Test Case Specification & Result_SWQT_20260817_ext.xlsx"
  # 檔 1 —— SWE.1 分析報告，驗證範圍主驅動（R-AM5：318 列全入範圍）。
  # 分頁名非標準（Part 01–04，無 Analysis Report），sniffer 必誤判 → R-AM1。
  a03_report: "inputs/SWE.1_Audio_Management_Pending_For_Review.xlsx"
  # 檔 3 —— 錨源 Part 1（R-AM2）：245 物件，OID 4865821–4866154。
  sys1_export: "inputs/CFTS019-AudioManagement-Part1_released_20260415.xlsx"
  # 檔 4 —— 錨源 Part 2（R-AM2）：566 物件，OID 4866155–4867787。
  # B1 全批之錨落在此本（4866451–4867769）。
  sys1_export_part2: "inputs/CFTS 019_Part2 -All Accepted-Except-DTC-rework.xlsx"
  # 檔 2 —— **真 PDF**，文字層完好（pdftotext 13,887 行、1,964 個唯一
  # ObjectID、範圍 4865821–4867784，涵蓋 Part1+Part2 全文）。
  # 01 包 §一 之「實為純文字，非 PDF」「副檔名與內容不符」與「234 個
  # ObjectID」三項均與實測不符 —— 見 A-AM02。供章節上下文查閱，不作錨源。
  spec_pdf: "inputs/R1LR_Atl-H_25PI3.5_Multimedia - Radio and Audio_CFTS 019_Audio Management_20250910_1235.pdf"
  # intake 未命中 Pop Up 素材；03 包亦未引用。
  popup_list: null

# SWE.1 之 318 列散在四個分頁（Part 01=76、02=203、03=18、04=21），而
# scripts/recon.py 之 survey_a03 只吃單一分頁。比照 vehicle_setting（R-VS4）：
# recon 取列數最多者為代表，**leaf 全集以 `data/leaves.tsv` 為準**
# （318 列／317 唯一 SWE ID，由 scripts/build_leaves.py 產）。
# 故 RECON.md 之 leaf 數僅反映代表分頁，不可當作覆蓋率基準。
paths_meta:
  a03_sheet: "Audio-Management Part 02"
  a03_header_row: 1        # 實測；資料自第 2 列起
  a03_all_sheets:          # 全集之來源，供 build_leaves.py 與末站校驗
    - "Audio-Management Part 01"
    - "Audio-Management Part 02"
    - "Audio-Management Part 03"
    - "Audio-Management Part 04"

spec_mode: "D"        # [PROPOSED] A/B/C/D/E per FEATURE_ONBOARDING §3
                      # 依據：錨定「looked up, never constructed」—— 錨值逐葉取自
                      # 03 包 §四表，執行層不得自行改錨。雖來源形態為 Polarion
                      # xlsx export（近 A），但無 outline 可構造、無橋接欄可走
                      # （F1），行為與 time_management / sxm 之 D 同型。
spec_reference_template: "CFTS019-{object_id}"   # R-AM2 / IN §10.7(a)；一 ID 一行

workbook:
  # rev C 版面，2026-08-26 實測確認（非鏡射、非推定）：母本已複入 inputs/
  # （sha256 6372fb6b…6fb825b2，與 forms/ 母本及 time_management 所記相同），
  # 直讀第 9 列表頭，16 個宣告欄位全數對上。scaffold 預設之 rev A/B 值在
  # design_method / author 兩處為誤，且無 tc_id 鍵 —— 已更正。
  sheet: "Test Case Specification 測試用例規範"   # 實測；見 forms/FORMS.md
  header_row: 9
  # column letters, verified by recon header match — do not guess
  columns:
    req_id: "D"       # 實測 "Requirement or Design ID"；C 為 (Polarion) 版，勿混
                      # R-AM7：照抄 SWE1_AMM_{NNN} 底線式
    tc_id: "F"        # 實測 "Test Case ID"；E 為 Test Case ID (TestRail)
    test_group: "G"
    test_set: "H"
    test_item: "I"
    pre_conditions: "J"
    input_test_data: "K"
    test_procedure: "L"
    expected_result: "M"
    spec_reference: "N"
    tc_ref_id: "O"
    priority: "P"
    design_method: "R"      # 實測 "Test Case Design Methods"；Q 為 Estimated Test Time (mins)
    functional_safety: "S"  # 實測 "Functional Safety"
    author: "AA"            # 實測 "Test Case Author"；Z 為 Fastack (376) Atl-Mi
    remarks: "AH"           # 實測 "Remarks"；AG 為 Defect ID

done_region:
  # detection: "author" (author-cell match) or "rows" (explicit ranges)
  detection: "none"         # BLANK per R-AM3；新簿空白起建，無 done region
  # author_value: 不適用 —— BLANK 下無 done region，留值會使 content_hash 在 0 列上恆真
  # invariant: "content_hash" (interleaved-safe) or "positional"
  invariant: "content_hash"

write_back:
  author_value: "PeiPYHsu"
  tc_ref_id_value: "NEW"     # 無 legacy 列可繼承大小寫（舊簿依 R-AM3 不續寫）
  # [PROPOSED] 03 包 §二只給 `{project}-AMM-{NNN}`（IN §10.3），並註明
  # 「project token 循 repo 既有慣例」。repo 既有慣例為 NR1L
  # （舊 AudioAACP 簿之 NR1L_AudioMgnt_*、TM 之 NR1L-TimeManagement-*）。
  # 分隔符取連字號以從 TM／canon，不從舊簿之底線式。待 Pei 確認。
  tc_id_format: "NR1L-AMM-{n:03d}"
  fill_test_group_set: true  # canon §2 —— true under BLANK

lint:
  design_method_source: "dropdown_sheet"   # exact-string vocabulary
  popup_ids: []                            # 本 feature 無 Pop Up 引用
  extra_rules: []                          # feature-specific lint hooks
