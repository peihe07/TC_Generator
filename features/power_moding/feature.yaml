# feature.yaml — pipeline configuration for Power_Moding
# All feature-specific constants live HERE; shared scripts read this file
# and contain no per-feature literals. Regenerate nothing by editing code.
#
# Phase 0：01 包（2026-08-22）建立，**02 包（2026-08-23）依 R-PMH7～R-PMH9
# 大幅改寫**。改寫之範圍與依據：
#   - `paths.workbook`：改指 R-G1 全域母本之工作副本（R-PMH7）。客戶那份
#     降為 `customer_source_copy`，僅供 leaf 對應查核與附屬分頁取得。
#   - `workbook.columns`：01 包之 16/16 **作廢**（其量測對象為 35 欄之離群
#     版面），改對母本 r9 重測（R-PMH9），並與三份已交付件四方逐欄比對通過。
#   - `workbook_state`：`PENDING_RULING` → `BLANK`（R-PMH8）。
# 未實測者一律留 TBD／null，不猜。
#
# 客戶交付夾：/Users/peihe/Work/02_Project_R1LR/10_Reviewing/00_TestCase/
#             ASW-R2/Disclaimer screen/
#   —— 夾名 `Disclaimer screen` 為 FROP 標籤，**不入任何 TC 欄位**（R-PMH2）。
#   ⚠ 見 A-PMH07：R-PMH2 所引之 Comfort R-C6 前例，於實際交付件上未實現
#     （Comfort 交付件 G 欄 466 列全為交付夾名 `Climate Control Interface`）。

feature: "Power Moding"
slug: "power_moding"                   # R-PMH2
# R-PMH13（Pei 2026-08-23 核可）—— **交付夾名，不是規格模組名**。
# 依據為四份已交付件之實測：G 欄相異值恰為交付夾名，覆蓋 4/4、各檔 100%
# （Comfort 466/466 = `Climate Control Interface`、User Profiles 189/189、
#  Time Management 59/59、Power Management 283/283）。
# R-PMH2 之後半（`test_group` 為 `Power Moding`）已撤回；其前半
# （`feature` / `slug`）維持有效 —— 那是 repo 內部識別，不進交付欄位。
# ⚠ R-PMH18 —— `screen` 為**小寫 s**，與 tc_id 之 `DisclaimerScreen` 刻意不同。
#   二者不得「統一」；一切比對與 lint 須大小寫敏感。
# ⚠ 不得讀成 R-C6 之同型錯誤（A-PMH07：R-C6 裁「填 Comfort」而其交付件
#   466 列全填 `Climate Control Interface`）。
test_group: "Disclaimer screen"

# R-PMH16（Pei 2026-08-23 裁「乙」案）—— `{abbr}` = 交付夾名去空白之 PascalCase。
# ⚠ R-PMH18 —— `Screen` 為**大寫 S**。
# 已知反例隨條保留：Comfort 之 `{abbr}` 為 `ComfortHMI` 而其交付夾名為
# `Climate Control Interface` —— 該件不符本判準，且它是依 R-PMH14 篩出之
# **唯一具鑑別力語料**（其餘三份之交付夾名與規格模組名相同，鑑別力為零）。
# 故本條為本 feature 之裁定，**不主張為全案慣例**；他 feature 引用前須自查其交付件。
tc_id_format: "NR1L-DisclaimerScreen-{NNN}"

# R-PMH26 —— 上游 037 報告之**檔名**一致性不在本 feature 之範圍。
#   (a) 不就 037 檔名差異開 DR、不產生要求上游改名之建議；
#   (b) 不以「上游命名將趨於一致」為前提設計任何欄位、判準或腳本；
#   (c) 037 檔名之差異不登記為 anomaly（非缺陷，是無權處置之外部事實）；
#   (d) 判準之正確性若取決於上游命名一致，該判準即不成立。
# **(d) 於本 feature 之適用點：`inputs/MANIFEST.sha256`。**
#   該台帳以「SHA256 + 檔名」兩欄記載，其**指稱以 SHA256 為主、檔名為輔** ——
#   `shasum -c` 之比對標的是雜湊，檔名只是定位。**本項已滿足，未改動**；
#   記明於此，以免日後有人把台帳改成只記檔名（那會使指稱依賴上游命名）。
# 下列 `paths.*` 之值為檔名，其正確性由 MANIFEST 之 SHA256 背書，非由檔名自證。

paths:
  # R-PMH7 —— 交付基底為 R-G1 全域母本之工作副本。
  # SHA256 6372fb6be02f48dc3a3e091a60d2e2b3cf26d8704c27e25d79b7c9516fb825b2
  # 與 R-PMH7 條文所載逐字相同（02 包步驟 4 實測）。
  workbook: "inputs/FM-WI-FSM-036-A01 STLA 測試用例規範與結果_SWQT STLA Test Case Specification & Result_SWQT_20260817_ext.xlsx"
  # R-PMH7 —— 「需求對應之來源複本」。**不作交付基底、不作版面依據、
  # 不作 style authority**。SHA256 2be63feb…664625a54。用途限二項：
  #   (1) 037→036 之 leaf 對應查核；
  #   (2) 其三個附屬分頁（Test Case Framework／Reference／QS Suggestion）
  #       之內容取得 —— 母本為 9 分頁，無 `Test Case Framework`。
  # ⚠ A-PMH09 —— **其 `Cover 封面`／`ChangeHistory 修訂履歷`／
  #   `Product Document 記錄封面頁` 三頁不得取用**：ChangeHistory 之 rev C
  #   列已被覆寫為 **AMFM feature 之寫回註記**（`SWE1_AMFM`、143 TC／102 leaf／
  #   自 r168 append），表單自身之版本沿革在該檔已遺失；`Cover!D6` 版本為 `A`
  #   而其 ChangeHistory 有 A/B/C 三列，檔案自相矛盾。
  #   上列 (2) 之「附屬分頁」僅指 Reference／QS Suggestion／Test Case Framework。
  customer_source_copy: "inputs/FM-WI-FSM-036-A01 STLA 測試用例規範與結果_SWQT STLA Test Case Specification & Result_SWQT_PowerModingHMI_20260819.xlsx"
  a03_report: "inputs/FM-WI-FSM-037-A03-N1L-SWE1-PowerModing-HMI-V0.1 STLA 報告.xlsx"
  sys1_export: "inputs/SYS1_HMI_Power_Moding_HMI_Logic_and_Flow_R1_SR24_2A.xlsx"
  spec_pdf: "inputs/Power Moding HMI Logic and Flow R1 SR24 2A DCR22412 (January 24 2023).pdf"
  popup_list: null                     # 交付夾未提供；037 亦無 PU-number id

# 01 包步驟 7 實測，02 包 §1.2 核可。兩面基線依 §9.1 通則 3 指定分工，
# 依通則 7「增欄不取代」並存。
spec_mode: "A+B"
spec_baseline:
  interpretation:   "spec_pdf"      # 判讀基準（內文面）—— 11/11 頁具文字層
  traceability:     "sys1_export"   # 追溯用（結構面）—— Outline Number 之權威
  known_exceptions:
    - "sys1_export 之 6 則 outline（2.1/3.1/4.1/5.1/6.1/12.4）為圖片佔位，
       內容僅存於 PDF 流程圖。該六者不在 037 引用之 29 章節內。見 A-PMH04。"
    - "sys1_export 之 outline 7.1 相對 PDF 為**重排**；流程之語句順序以 PDF
       為準。**Phase 4 之指名複核項**（該章節 5 個 leaf，且被移位改寫者為
       動畫／splash 之時序）。見 A-PMH03 與 02 包 §1.2。"
    - "spec_pdf 為 Visio 匯出之流程圖冊，**無編號目次**。`{outline}` 一律取自
       sys1_export，不得以 PDF 之 section regex 構造。"
    - "pdftotext -layout 對多欄流程圖頁會誤切；圖頁之判讀須以圖像 render
       為準（canon §3 之無條件義務）。"

spec_reference_template: "Power Moding HMI Logic and Flow R1 SR24 2A_{outline}"

workbook:
  sheet: "Test Case Specification 測試用例規範"
  header_row: 9
  first_data_row: 10
  last_capacity_row: 1411        # 實測：B 欄公式止於 B1411（B1412 為 None）；
                                 # 四組 DV 之 sqref 亦皆止於 1411
  # layout_note —— 母本為 **A–AH 共 34 欄**（rev C 標準版面）。
  #   `Estimated Test Time (mins)` **恰出現一次**（Q）—— R-PMH7 之判準通過。
  #   與 01 包所測之客戶那份（35 欄、P/R 兩個 Estimated Test Time）不同版面：
  #   自 priority 起每欄左移一格。01 包之欄位表已依 R-PMH9 作廢。
  #   四方交叉佐證（R-PMH9）：母本 ＋ User Profiles 20260820 ＋
  #   Comfort 20260817 ＋ Time Management 20260822，r9 表頭 34 欄逐欄相等。
  columns:
    req_id: "D"            # Requirement or Design ID 需求/設計 ID
    tc_id: "F"             # Test Case ID 測試用例ID
    test_group: "G"        # Test Group 測試組
    test_set: "H"          # Test Set 測試集
    test_item: "I"         # Test Item 測試項目
    pre_conditions: "J"    # Pre-Conditions 先前條件
    input_test_data: "K"   # Input Test Data 輸入條件
    test_procedure: "L"    # Test procedure 測試程序
    expected_result: "M"   # Expected Result 預期結果
    spec_reference: "N"    # Specification Reference 規格參考
    tc_ref_id: "O"         # Test Case Reference ID 測項參考ID
    priority: "P"          # Test Case Priority（01 包誤記 Q —— 離群版面）
    design_method: "R"     # Test Case Design Methods（01 包誤記 S）
    functional_safety: "S" # Functional Safety 功能安全（01 包誤記 T）
    author: "AA"           # Test Case Author 測試案例作者（01 包誤記 AB）
    remarks: "AH"          # Remarks 備註（01 包誤記 AI）
  # 未入 16 鍵但已實測之欄：C req_id_polarion / E tc_id_testrail /
  #   Q estimated_test_time / T–Z 七個車型欄 / AB test_version /
  #   AC test_vehicle / AD test_period / AE tester / AF test_result /
  #   AG defect_id
  b_column_formula: '=IF(ISBLANK($D{row}),"",ROW()-9)'   # 實測 B10–B1411
  freeze_panes: null                                     # 實測：母本無凍結窗格
  merged_cells: ["A1:AE1", "B7:AA7", "AB7:AH7", "T8:Z8"]
  # ⚠ `data/outline_map.json` 之 `row_036_customer` 欄記的是 leaf 在
  #   **客戶那份**之列號（10–57），**不是寫回目標列**。母本為 BLANK，
  #   寫回目標由 `write_back.first_row` 起之 append 順序決定。
  #   任何以 `row_036_customer` 定位寫回之程式即為缺陷（02 §11 第 4 項）。
  # R-PMH27（Pei 2026-08-24 裁「（甲）」）—— 前言三欄一律留空。**Q3 已結清。**
  # 結論同 R-PMH10，其依據段更換：原「語料 5/5 無一填寫」作廢（母體未定義），
  # 改依 R-PMH24 之母體實測 —— D3 全空、D4 全空、D5 空者略多
  # （分析層 9/16；執行層實測 9/17，差異見 upstream/05 §2，繫於
  #  `Engineering Mode/App Team Effort/` 之身分，待 Pei 裁）。
  # ⚠ 本裁定**非多數決**，三項須隨條保留：
  #   (a) 非空者中有數者填錯（他 feature 之 037 報告名／表單編號本身／文件編號）；
  #   (b) 案（乙）之代價為版號過期無通知機制（本 037 為 V0.1，Popup 已至 V0.2）；
  #   (c) 部分 feature 無單一份 037（VF230 11 份、CFTS044 4 份），案（乙）非良定義。
  # 日後若客戶要求填寫，字串由 Pei 給定並另立新條，不得以「補上」之名逕行填寫。
  preamble_cells_keep_blank: ["D3", "D4", "D5"]
  data_validation:               # 實測自 sheet6.xml 之 sqref，未經 openpyxl 存回
    priority:      {range: "P10:Q1411", kind: "standard"}
    vehicle_models: {range: "T10:Z1411", kind: "standard"}
    test_result:   {range: "AF10:AF1411", kind: "standard"}
    design_method: {range: "R10:R1411", kind: "x14", source: "下拉選單!$A$1:$A$9"}
  # R-PMH20 —— 上列為**本分頁**（Test Case Specification）之 DV，共 4 組。
  # **全簿**為 5 組：另有 `Product Document 記錄封面頁!B7:C7`
  # （legacy list，`"Confidential, Top Secret"`）—— 不在寫回範圍內。見 A-PMH11。
  # ⚠ A-PMH12 —— 兩項母本 DV 瑕疵，Phase 6／7 首次填值前必須處理：
  #   (1) priority 之 sqref 跨 P、Q 兩欄 → `Q`（Estimated Test Time）套用
  #       `"P0,P1,P2,P3"`，任何分鐘數都會被擋下；
  #   (2) `AF` 列舉逐字為 `"Pass, Fail, Pending,Block,NA"` —— ` Fail` 與
  #       ` Pending` **含前導空白**，寫入 `Fail`（無空格）會被擋下。
  # ⚠ A-PMH10 —— 客戶那份之 x14 DV source 為 `Reference!$C$4:$C$12`（非
  #   `下拉選單`），其第 6 項為 `Pair-wise / N-wise`。本 feature 之權威為母本
  #   之 `下拉選單!$A$1:$A$9`（`Pairwise / t-wise`）。
  # ⚠ x14 DV 存在 —— **不得以 openpyxl 開啟後 save()**（R-G1 註／R-G3）。
  #   寫回一律走 xlsx_surgical splice。停止條件 9。

# R-PMH8 —— 撤回 `PREFILLED_DRAFT`。實測佐證：母本資料區（r>=10）除 B 欄
