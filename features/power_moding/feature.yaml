# feature.yaml — pipeline configuration for Power_Moding
# All feature-specific constants live HERE; shared scripts read this file
# and contain no per-feature literals. Regenerate nothing by editing code.
#
# Phase 0（2026-08-22，下放包 01）填入。每一欄位之來源：
#   - 欄位字母：對 inputs/ 之 036 複本（SHA256 2be63feb…664625a54）r9 表頭
#     逐欄實測，16/16 唯一命中（比對法：取換行前英文段、空白正規化、小寫、
#     逐字相等）。**未沿用任何既有 feature 之欄位表**（R-PMH3(a)）。
#   - 命名值：R-PMH1／R-PMH2 逐字。
#   - spec_mode：步驟 7 之跨素材抽取試驗（見 docs/upstream/01_intake.md §5）。
# 未實測者一律留 TBD／null，不猜。
#
# 客戶交付夾：/Users/peihe/Work/02_Project_R1LR/10_Reviewing/00_TestCase/
#             ASW-R2/Disclaimer screen/
#   —— 夾名 `Disclaimer screen` 為 FROP 標籤，**不入任何 TC 欄位**（R-PMH2）。

feature: "Power Moding"
slug: "power_moding"                   # R-PMH2
test_group: "Power Moding"             # R-PMH2：規格標題之模組名，非交付夾名
                                       # （Comfort R-C6 同型前例）
tc_id_pattern: TBD                     # Phase 3 定；本工作簿 F 欄 48 列全空

paths:
  # 母本身分待裁（Q2）—— 現指向客戶交付夾之現有 036（已含 48 列 req 對應）。
  # 若 Q2 裁為改用 R-G1 母本 forms/…_20260817_ext.xlsx，此鍵與下方 columns
  # 須整組重測（二者版面不同，見 workbook.layout_note）。
  workbook: "inputs/FM-WI-FSM-036-A01 STLA 測試用例規範與結果_SWQT STLA Test Case Specification & Result_SWQT_PowerModingHMI_20260819.xlsx"
  a03_report: "inputs/FM-WI-FSM-037-A03-N1L-SWE1-PowerModing-HMI-V0.1 STLA 報告.xlsx"
  sys1_export: "inputs/SYS1_HMI_Power_Moding_HMI_Logic_and_Flow_R1_SR24_2A.xlsx"
  spec_pdf: "inputs/Power Moding HMI Logic and Flow R1 SR24 2A DCR22412 (January 24 2023).pdf"
  popup_list: null                     # 交付夾未提供；037 亦無 PU-number id

# 步驟 7 實測：兩面基線，依 §9.1 通則 3 指定分工，依通則 7「增欄不取代」並存。
spec_mode: "A+B"
spec_baseline:
  interpretation:   "spec_pdf"      # 判讀基準（內文面）—— 11/11 頁具文字層
  traceability:     "sys1_export"   # 追溯用（結構面）—— Outline Number 之權威
  known_exceptions:
    - "sys1_export 之 6 個 outline（2.1/3.1/4.1/5.1/6.1/12.4）描述為
       `Please refer to the diagram (image: …png)` 圖片佔位，無文字內容；
       其內容僅存於 PDF p3–p7 之流程圖。**該六者不在 037 引用之 29 章節內**，
       但屬 Layer 2 之目次輸入。見 A-PMH04。"
    - "sys1_export 之 outline 7.1 相對 PDF 為**重排**（文字 777 字 100% 見於
       PDF，惟切成兩段落於 PDF 之不同位置）；流程之語句順序以 PDF 為準。
       見 A-PMH03。"
    - "spec_pdf 為 Visio 匯出之流程圖冊，**無編號目次**（pdftotext 偵得之
       章節號僅頂層 1–10 且為誤命中）。故 `{outline}` 一律取自 sys1_export，
       不得以 PDF 之 section regex 構造。"
    - "pdftotext -layout 對多欄流程圖頁會誤切（通則 7 之「誤切之來源」）；
       圖頁之判讀須另以圖像 render 為準（canon §3）。"

# 037 之 `HMI Source ID` 欄 48 列格式即為本模板之實例，故 template 非構造而是
# 複現：`Power Moding HMI Logic and Flow R1 SR24 2A_7.1` 等。
spec_reference_template: "Power Moding HMI Logic and Flow R1 SR24 2A_{outline}"

workbook:
  sheet: "Test Case Specification 測試用例規範"   # 實測；非 rev A/B 之 "…&Result"
  header_row: 9
  first_data_row: 10
  last_capacity_row: TBD          # 未實測（B 欄公式與 DV 上界）
  # layout_note —— 實測為 **A–AI 共 35 欄**，非 rev C 之 A–AH 34 欄：
  #   P 與 R **兩欄同名** `Estimated Test Time (mins)`（唯一重複表頭）。
  #   故自 priority 起，每一欄較 rev C（user_profiles / time_management）
  #   再右移一格：priority Q（rev C 為 P）、design_method S（R）、
  #   functional_safety T（S）、author AB（AA）、remarks AI（AH）。
  #   AH 於本版面實為 Defect ID —— 誤用 rev C 之 AH 會寫進 Defect ID 欄。
  columns:
    req_id: "D"            # Requirement or Design ID 需求/設計 ID
    tc_id: "F"             # Test Case ID 測試用例ID
    test_group: "G"        # Test Group 測試組
    test_set: "H"          # Test Set 測試集
    test_item: "I"         # Test Item 測試項目
    pre_conditions: "J"    # Pre-Conditions 先前條件
    input_test_data: "K"   # Input Test Data 輸入條件
    test_procedure: "L"    # Test procedure 測試程序
    expected_result: "M"   # Expected Result 預期結果
    spec_reference: "N"    # Specification Reference 規格參考
    tc_ref_id: "O"         # Test Case Reference ID 測項參考ID
    priority: "Q"          # Test Case Priority 測試用例優先級別
    design_method: "S"     # Test Case Design Methods 測試用例設計方法
    functional_safety: "T" # Functional Safety 功能安全
    author: "AB"           # Test Case Author 測試案例作者
    remarks: "AI"          # Remarks 備註
  # 未入 16 鍵但已實測之欄，供 Phase 3 參考，本包不使用：
  #   C req_id_polarion / E tc_id_testrail / P,R estimated_test_time（重複）
  #   U–AA 七個車型欄 / AC test_version / AD test_vehicle / AE test_period
  #   AF tester / AG test_result / AH defect_id
  data_validation: TBD     # 未實測（含 x14 擴充）—— Q2 定案後隨母本一併測

# 步驟 6 之逐列判定結果見 docs/upstream/01_intake.md §4。
# canon §2 四類皆不合：filled = 48、qualifying done = 0。
# **不自行歸類**（停止條件 2）—— 待 Q1 裁定。
workbook_state: PENDING_RULING   # 提案 `PREFILLED_DRAFT`，見 Q1

done_region:
