# feature.yaml — pipeline configuration for Time_Management
# All feature-specific constants live HERE; shared scripts read this file
# and contain no per-feature literals. Regenerate nothing by editing code.

feature: "Time Management"
test_group: "Time Management"           # R-TM85（Pei 2026-08-25 定案，推翻 R-TM2 之 [PROVISIONAL]）

paths:
  workbook: "inputs/FM-WI-FSM-036-A01 STLA 測試用例規範與結果_SWQT STLA Test Case Specification & Result_SWQT_20260817_ext.xlsx"  # R-G1 母本複本；SHA256 6372fb6b…6fb825b2，與 forms/ 母本相同
  a03_report: "inputs/SWE1_Secure_Date&Time.xlsx"
  sys1_export: "inputs/SYS2_CFTS_015_Time and Date _SR26_V1_Including_Delta_Released.xlsx"        # null if spec_mode has no export
  spec_pdf: "inputs/R1LR_Atl-H_25PI3.5_Cabin_CFTS _015 Time and Date _SR26_20250909-1851.docx"  # cfts_doc；手填，見 A-TM10
  popup_list: null   # intake 命中測試 0（無 String/Popup Message 表頭、無 PU-number id）；見 01 §5(7)

spec_mode: "D"        # A/B/C/D/E per FEATURE_ONBOARDING §3
spec_reference_template: "CFTS015-{source_item_id}"   # R-TM40

workbook:
  sheet: "Test Case Specification 測試用例規範"   # rev C 版面，見 FORMS.md
  header_row: 9
  # column letters, verified by recon header match — do not guess
  columns:
    req_id: "D"
    tc_id: "F"        # Test Case ID；R-TM34
    test_group: "G"
    test_set: "H"
    test_item: "I"
    pre_conditions: "J"
    input_test_data: "K"
    test_procedure: "L"
    expected_result: "M"
    spec_reference: "N"
    tc_ref_id: "O"
    priority: "P"
    design_method: "R"      # rev C；Q 為 Estimated Test Time (mins)
    functional_safety: "S"  # rev C
    author: "AA"            # rev C；Z 為 Fastack (376) Atl-Mi
    remarks: "AH"           # rev C 實測確為 AH（rev A/B 為 AG）

done_region:
  # detection: "author" (author-cell match) or "rows" (explicit ranges)
  detection: "none"         # BLANK per R-TM5；本 feature 無 done region
  # author_value: 不適用 —— BLANK 下無 done region，留值會使 content_hash 在 0 列上恆真
  # invariant: "content_hash" (interleaved-safe) or "positional"
  invariant: "content_hash"

write_back:
  author_value: "PeiPYHsu"
  tc_ref_id_value: "NEW"
  tc_id_format: "NR1L-TimeManagement-{n:03d}"   # R-TM32 / R-TM85 回改
  fill_test_group_set: true
  # D5 / W-TM-26 T5 —— 內容欄資料列之對齊。置中使多行文字之每行編號前
  # 出現視覺空白（文字層無前導空白，已逐字驗證）。交付基準
  # （UserProfiles 0824）同欄為預設靠左。wrapText 由來源 xf 帶過不動。
  data_alignment:
    columns: [test_item, pre_conditions, input_test_data, test_procedure, expected_result]
    horizontal: left
    vertical: top      # BLANK per R-TM5，依 canon §2

lint:
  design_method_source: "dropdown_sheet"   # exact-string vocabulary
  popup_ids: []                            # e.g. [PU0091, PU0942] — verbatim check
  extra_rules: []                          # feature-specific lint hooks
