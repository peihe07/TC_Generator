# R-VC10 —— **明文排除四項**：`dbc_b` / `dbc_fd` / `lid` / `proxi` 不綁定。
# 依據：037 全文掃描之 CAN 訊號、PROXI 參數、VF 引用命中數皆為 0；
# 規格本文之 VF507 / VF352 落在 037 未涵蓋之 18 節內（DR-VC4 為條件性）。
