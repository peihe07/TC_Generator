# feature.yaml — pipeline configuration for SW Update
# All feature-specific constants live HERE; shared scripts read this file
# and contain no per-feature literals. Regenerate nothing by editing code.
#
# 條文依據：RULINGS.md 之 R-SU1 ~ R-SU6（R-SU4／R-SU6 為下放包 02 之 v2）。

feature: "SW Update"
test_group: "SW Update"          # R-SU1（Q1、Q6）

paths:
