  popup_list: "inputs/Pop Up List HMI R1 (26PI).xlsx"

# T2 實測（2026-08-27）：037 之需求分頁名為 `AnalysisReport_FULL`（無空格），
# intake.py 之 SHEET_SIGNATURES（`"Analysis Report" in names`）不命中，
# 落 `spec_xlsx`。依 R-DM5／R-DM24 同型處置以 override 指名，不改腳本。
intake:
  kind_overrides:
    "SoftwareUpdate_FM-WI-FSM-037-A03_STLA_Report_SWRA.xlsx":
      kind: a03_report
      reason: "下放包 01 §三 3.2 + T2 實測：需求分頁名為 AnalysisReport_FULL（無空格），非 'Analysis Report'；18 欄舊版面"
      sha256: "5d67ffc17b9847a10463e2eb7372e77af39742de6670d066d482db1669a99fbf"

paths_meta:
  a03_sheet: "AnalysisReport_FULL"   # 037 之需求分頁，表頭列 7、資料列 8 起

# ⚠ T13（下放包 03）逐條核對結果：本 feature 實為 **A + B + D**，
# 現值 "A" 為 intake.py 之提案（其 propose_spec_mode() 於 sys1 命中即
# `return "A"`，結構上無法報出組合，見上繳包 02 §一 T13）。
# 依 T13「不符即停」，執行層**不逕改**，待分析層裁定後回填。
spec_mode: "A"                    # [待裁 —— 實測為 A+B+D]
spec_reference_template: null     # R-SU4 v2：查得（CFTS ObjectID／SYS1 欄原值），非構造

workbook:
  sheet: "Test Case Specification 測試用例規範"
  header_row: 9
  # 欄位字母為本母本之表頭字串實測（T3，2026-08-27），非沿用他 feature
  columns:
    req_id: "D"              # Requirement or Design ID 需求/設計 ID
    test_group: "G"          # Test Group 測試組
    test_set: "H"            # Test Set 測試集
    test_item: "I"           # Test Item 測試項目
    pre_conditions: "J"      # Pre-Conditions 先前條件
    input_test_data: "K"     # Input Test Data 輸入條件
    test_procedure: "L"      # Test procedure 測試程序
    expected_result: "M"     # Expected Result 預期結果
    spec_reference: "N"      # Specification Reference 規格參考
    tc_ref_id: "O"           # Test Case Reference ID 測項參考ID
    priority: "P"            # Test Case Priority 測試用例優先級別
    design_method: "R"       # Test Case Design Methods 測試用例設計方法（x14 下拉，R-SU2）
    functional_safety: "S"   # Functional Safety 功能安全
    author: "AA"             # Test Case Author 測試案例作者
    remarks: "AH"            # Remarks 備註

done_region:
  # R-SU2：workbook_state = BLANK，本節不生效；下列為佔位，
  # 不得據以推論存在作者。
  detection: "author"
  author_value: null
  invariant: "content_hash"

write_back:
  author_value: "PeiPYHsu"        # R-SU2(b)
  tc_ref_id_value: "NEW"          # R-SU2(c)
  fill_test_group_set: true       # R-SU2(a)：BLANK -> FILL

