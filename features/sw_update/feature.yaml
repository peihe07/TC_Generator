# feature.yaml — pipeline configuration for SW_Update
# All feature-specific constants live HERE; shared scripts read this file
# and contain no per-feature literals. Regenerate nothing by editing code.

feature: "SW_Update"
test_group: "SW_Update"          # framework-internal; workbook write per profile

paths:
  workbook: "inputs/<FW036 xlsx>"
  a03_report: "inputs/<037 xlsx>"
  sys1_export: "inputs/<SYS1 xlsx>"        # null if spec_mode has no export
  spec_pdf: "inputs/<spec pdf>"            # null if spec_mode E
  popup_list: "inputs/<Pop Up List xlsx>"  # null if not referenced

spec_mode: "A"        # A/B/C/D/E per FO §3
spec_reference_template: "<Spec Filename>_{outline}"

workbook:
  sheet: "Test Case Specification&Result"
  header_row: 9
  # column letters, verified by recon header match — do not guess
  columns:
    req_id: "D"
    test_group: "G"
    test_set: "H"
    test_item: "I"
    pre_conditions: "J"
    input_test_data: "K"
    test_procedure: "L"
    expected_result: "M"
    spec_reference: "N"
    tc_ref_id: "O"
    priority: "P"
    design_method: "Q"
    functional_safety: "R"
    author: "Z"
    remarks: "AH"      # verify at recon; dropping it drops BLOCKED notes

done_region:
  # detection: "author" (author-cell match) or "rows" (explicit ranges)
  detection: "author"
  author_value: "Arif"
  # invariant: "content_hash" (interleaved-safe) or "positional"
  invariant: "content_hash"

write_back:
  author_value: "PeiPYHsu"
  tc_ref_id_value: "NEW"
  fill_test_group_set: false     # true only under BLANK per FO §2

lint:
  design_method_source: "dropdown_sheet"   # exact-string vocabulary
  popup_ids: []                            # e.g. [PU0091, PU0942] — verbatim check
  extra_rules: []                          # feature-specific lint hooks
