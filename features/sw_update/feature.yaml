  sys1_export: "inputs/SYS1_HMI_Software_Updates_FOTA_HMI_Logic_and_Flow_R1_SR24_post_2A_(Aug_30_2023).xlsx"
  spec_pdf: "inputs/Software Updates FOTA HMI Logic and Flow R1 SR24 post 2A (Aug 30 2023).pdf"   # R-SU6 v2：真 PDF 1.6，68 頁全文字層
