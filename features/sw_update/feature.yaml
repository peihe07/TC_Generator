  # T5' 實測（2026-08-27）：037 全欄 4 個、規格 PDF 文字層 52 個。
  # 本清單取兩源聯集之**已查得者**（51）—— 逐字檢查用。
  # `PU971`（PDF p.46）於 `forms/Pop Up List HMI R1 (26PI).xlsx` **查無**，
  # 依 A-SU3 排除於本清單外，不代以語意相近之 PU0971。
