# feature.yaml — pipeline configuration for vsm_v42
# All feature-specific constants live HERE; shared scripts read this file
# and contain no per-feature literals. Regenerate nothing by editing code.
#
# 下放包 00 §五 W-1。來源以 `sources/` 之 doc_id 引用（R-G27）——
# 本 feature 不存原檔副本，`inputs/` 恆空；`paths.*` 為指向
# `sources/raw/<doc_id>/` 之相對 glob。
#
# ⚠ 落檔當下（2026-09-01）`_intake/Vehicle_Setup_VF665/` 實測 0 files，
# 五件原檔皆未投遞，`sources/raw/` 之五個 doc_id 目錄尚未建立（W-2 未執行）。
# 以下 `paths.*` 為 W-2 落檔後之預定落點宣告，**尚未逐鍵實測**；
# 每鍵之實測與 sha256 於 W-2 補做並回填（下放包 00 §七-2）。

feature: "Vehicle Setup Management R1 Low"      # R-VL3
test_group: "Vehicle Setup Management R1 Low"   # R-VL3，同值

sources:
  # R-G27 之 doc_id ↔ `sources/MANIFEST.tsv`（W-2 落列）。
  # 目前無腳本以 doc_id 解析路徑，故 `paths.*` 另以相對 glob 具名；
  # 兩者所指須為同一檔，W-2 落檔後實測。
  spec_docx: "vf665_v42_spec_r6"          # 下放包 00 §三 #1，母 spec
  sysra: "vf665_v42_sysra"                # #2，跨源驗核，非母體（R-VL4）
  a03_report_parksense: "vf665_037_parksense"   # #3，母體來源
  a03_report_sdw: "vf665_037_sdw"               # #4，母體來源
  sysad: "vf665_sysad_sys3"               # #5，架構參考，V42／V43 共用

paths:
  # 工作簿自 R-G1 母本（forms/…_SWQT_20260817_ext.xlsx）起建，落 sandbox/
  # （R-G25：xlsx 只准在此改）；R-VL1「BLANK 起建」。W-2 後產生。
  workbook: "sandbox/base/FM-WI-FSM-036-A01*_SWQT_20260817_ext.xlsx"

  # `a03_report` 為 recon 之代表檔（下放包 00 §五 W-3：取 #3 Park Sense）。
  # `feature_config.resolve_path` 要求 glob 恰 1 檔，故兩份 037 各以具名鍵
  # 掛一檔；leaf 全集另建 `data/leaves.tsv`（W-4）。
  a03_report: "../../sources/raw/vf665_037_parksense/*.xlsx"
  a03_report_parksense: "../../sources/raw/vf665_037_parksense/*.xlsx"
  a03_report_sdw: "../../sources/raw/vf665_037_sdw/*.xlsx"

  spec_docx: "../../sources/raw/vf665_v42_spec_r6/*.docx"
  sysra: "../../sources/raw/vf665_v42_sysra/*.xlsx"
  sysad: "../../sources/raw/vf665_sysad_sys3/*.docx"

  sys1_export: null      # 本線無 SYS1 匯出
  spec_pdf: null         # spec_mode D，母 spec 為 docx，無 pdf
  popup_list: null       # 未引用

  # forms/ 之共用參考檔，引用原位不搬（R-P368 三段鏈／R-P375(a)）
  lid: "../../forms/Logical Identifiers and CAN Mapping v1_78.xlsx"
  dbc_bhcan2: "../../forms/PDT27_E2A_R1_BHCAN2.dbc"
  dbc_fdcan8: "../../forms/PDT27_E2A_R1_FDCAN8.dbc"
  proxi: "../../forms/PROXI_HDCC27_R3_20250424.xlsx"

paths_meta:
  a03_sheet: "Analysis Report"
  a03_header_row_parksense: 7    # 下放包 00 §三 #3 之 intake 實測，W-3 複驗
  a03_header_row_sdw: 8          # 同 #4
  sysra_header_row: 5            # 同 #2

spec_mode: "D"        # FO §3；母 spec 為 OOXML docx（R-VL5）
# R-VL11(c)：落 null，待 P3 裁（VF 類母件之 IN §10.7 型態未定）；
# 執行層自填之構造式不得進 recon。
spec_reference_template: null

# TC ID：R-VL7（2026-09-01）—— 鍵名採全庫慣例 `write_back.tc_id_format`
# （`scripts/recon.py:1103` 所讀之鍵）；`tc_id_prefix` 已刪，不保留。
# 值依 R-VL3 = NR1L-VSM42-{nnn}，落於下方 write_back 段。

workbook:
  # R-VL8(b)：以下 sheet／header_row／columns 一律自 sandbox/base 副本第 9 列
  # **實測**回填，scaffold 模板值不得沿用。模板原值三處為誤（上繳 01 第 7 節已證，
  # 本包對副本重測再證）：sheet `Test Case Specification&Result`（該名不存在）、
  # design_method `Q`（實為 R）、author `Z`（實為 AA，Z 為車型欄 Fastack (376)）。
  sheet: "Test Case Specification 測試用例規範"
  header_row: 9
  columns:
    no: "B"                    # No.# 序號
    polarion_id: "C"           # Requirement or Design ID (Polarion)
    req_id: "D"                # Requirement or Design ID 需求/設計 ID
    testrail_id: "E"           # Test Case ID (TestRail)
    tc_id: "F"                 # Test Case ID 測試用例ID（R-VL11(b) 納入）
    test_group: "G"
    test_set: "H"
    test_item: "I"
    pre_conditions: "J"
    input_test_data: "K"
    test_procedure: "L"
    expected_result: "M"
    spec_reference: "N"
    tc_ref_id: "O"
    priority: "P"
    estimated_test_time: "Q"   # R-VL11(b) 納入
    design_method: "R"
    functional_safety: "S"
    author: "AA"
    test_version: "AB"
    remarks: "AH"
  # 車型欄（T–Z，本線 P637MCA／ATL-Mi 對應 V 欄 `VF(ProMaster)637 Atl-Mi`）
  variant_columns:
    hdcc27_atl_hi: "T"
    dt27_atl_hi: "U"
    vf_promaster_637_atl_mi: "V"
    commander_598_atl_mi: "W"
    renegade_5210_atl_mi: "X"
    toro_2261_atl_mi: "Y"
    fastback_376_atl_mi: "Z"
  # 測試執行欄（AC–AG），生成階段不寫
  execution_columns:
    test_vehicle_bench: "AC"
    test_period: "AD"
    tester: "AE"
    test_result: "AF"
    defect_id: "AG"

done_region:
  # R-VL1：BLANK 起建，無 done region；R-VL8(c)：author_value 落 null。
  detection: "author"
  author_value: null
  invariant: "content_hash"

write_back:
  tc_id_format: "NR1L-VSM42-{n:03d}"     # R-VL7；R-VL3 之值不變
  author_value: "PeiPYHsu"
  tc_ref_id_value: "NEW"
  fill_test_group_set: true      # BLANK 之故（FO §2）

lint:
  design_method_source: "dropdown_sheet"   # exact-string vocabulary
  popup_ids: []
  extra_rules: []
  # R-VL2(c)：本線走 IN §8.7.5 v3 判準，lint 檢查 P 以 `--profile vsm_v42` 呼叫。
  profile: "vsm_v42"
