  # privacy 之綁定不動。舊綁定留記以供回溯：
  #   features/privacy/inputs/R1LR_Atl-H_25PI3.5_Privacy_CFTS_022 Functional Specification_20250910_1708.docx
  #   sha256 5eb0dd739f002fe04e4891ceb9fd7d233b4e128a8b35eadce8ad6a631854dd78
  # 下列 sha256 為本包自實體檔以 `shasum -a 256` 重算。
  cfts022_fs:
    file: "features/ics_management/inputs/R1LR_Atl-H_26PI2.5 Jun Release-Privacy_CFTS_022 Functional Specification_20260608-1205.docx"
