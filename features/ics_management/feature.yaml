# R-G19 批次指紋之來源宣告。b01 之 TC 由 Claude Code session 依 canon
# 直接撰寫，未經 `backend/prompt_builder.py`、未呼叫 `backend/generator.py`，
# 故不列入慣例預設之該二檔 —— 把未參與生成之檔列入指紋，
# 會讓它的變動看起來影響產出、而它的不變看起來是保證，兩者都不實。
fingerprint:
  prompt_sources:
    - "docs/runtime/ASPICE_SWE6_AI_Instruction.md"
    - "features/ics_management/framework.md"
    - "features/ics_management/RULINGS.md"
    - "features/ics_management/docs/handoff/01_onboarding_first_batch.md"
    - "features/ics_management/docs/handoff/02_signal_resolution_and_ignore_face.md"
  # 本 feature 無 profile（`docs/runtime/profiles/` 下無 ICS 檔，本包實測）。
  # 空清單是實況，不是遺漏。
  exemplar_sources: []
