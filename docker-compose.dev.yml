services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tc_generator_backend
    command:
      - uvicorn
      - api_server:app
      - --app-dir
      - backend
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - backend
      - --reload-dir
      - docs
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TC_CORS_ORIGINS: http://localhost:3333,http://127.0.0.1:3333
    ports:
      - "8003:8000"
    volumes:
      - ./backend:/app/backend
      - ./docs:/app/docs
      - ./output:/app/output
      - ./pyproject.toml:/app/pyproject.toml:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    container_name: tc_generator_frontend
    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0
      - --port
      - "3000"
    environment:
      PYTHON_API_BASE: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "3333:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
  frontend_next_cache:
