# feature.yaml — pipeline configuration for SXM
# All feature-specific constants live HERE; shared scripts read this file
# and contain no per-feature literals. Regenerate nothing by editing code.

feature: "SXM"
test_group: "SXM"          # framework-internal; workbook write per profile

paths:
  # Phase 0: no pre-filled FW036 workbook exists for SXM anywhere in the
  # project tree (searched 2026-08-10; 20 instances found, none SXM), so this
  # is a SCAFFOLD copy of the blank form — revision C, SHA256 cd876c20…,
  # byte-identical to forms/…_SWQT_20260121.xlsx. Filename is [PROPOSED].
  workbook: "inputs/FM-WI-FSM-036-A01 STLA 測試用例規範與結果_SWQT STLA Test Case Specification & Result_SWQT_SXM_20260810.xlsx"
  a03_report: "inputs/SWE1_SXM_FM-WI-FSM-037-A03 STLA 報告_SWRA STLA Report_SWRA_20260406.xlsx"
  sys1_export: "inputs/SYS1_HMI_SiriusXM_360L_SAT_Only_HMI Logic and_Flow_R1_SR24_1A(May_24_2021).xlsx"
  # Spec-line PDF: the SR24 1A baseline the SYS1 export was taken from.
  spec_pdf: "inputs/SiriusXM 360L SAT Only HMI Logic and Flow R1 SR24 1A (May 24 2021).pdf"
  popup_list: null          # not referenced by this corpus — re-check at recon
  # Version-diff material ONLY (26PI2.5 reissue + its change log). NOT the
  # spec line: the baseline choice is [PROPOSED] and unruled, so these are
  # declared so recon can hash and survey them without them entering the
  # spec_reference path.
  spec_pdf_reissue: "inputs/SiriusXM 360L HMI Logic and Flow R1.pdf"
  spec_change_log: "inputs/SiriusXM 360L HMI Logic and Flow R1 Change Log.xlsx"
  # Feature availability matrix for 360L (SOA).
  feature_list: "inputs/SX-9845-0526_SOA_360L_Feature_List.xlsx"
  # Same-source copy from AMFM/inputs/ — SHA256 e5c12e9e… verified
  # identical on both sides (2026-08-10). Radio-side companion, in scope only
  # if recon finds SXM clauses delegating to it.
  cfts_doc: "inputs/R1LR_Atl-H_25PI3.5_Multimedia - Radio and Audio_CFTS 024_Specific HU Radio Functions_20250910_1239.docx"
  # Cited by leaves 009 / 012 / 017 / 036. Same-source copy from AMFM/inputs/,
  # SHA256 05e5a1f2… identical on both sides.
  cip_radio_tables: "inputs/CIP_Radio_Tables_v6.7.xlsx"
  # HYBRID source of record for CFTS024 clauses (DECISIONS §1). Same release
  # and same day as the .docx, exported 15 minutes apart; SHA256 325dba60….
  reqif_doc: "inputs/*CFTS 024_Specific HU Radio Functions_*.reqifz"
  # Component definitions for the SYSAD_SXM_APP/_PAL/_HAL ids every leaf's
  # Source Requirement ID column names. SHA256 9acb9eb2…; two older versions
  # exist with different content (A-SX06).
  sysad_doc: "inputs/SYS3_SXM_FM-WI-FSM-011-A01 系統架構設計 System Architectural Design_SYSAD_v0.2_20260629.docx"

# DECISIONS §1, signed 2026-08-10: mode D main line. Every one of the 202 leaf
# titles carries a 7-digit id that lands on an exact CFTS024 clause anchor in
# §1.5.x, so the citation source is the CFTS docx, not the SYS1 outline. The
# SYS1 export + SAT-only PDF stay in as the second source (mode C role: flows
# and figure pages), which is why sys1_export and spec_pdf remain declared.
spec_mode: "D"
spec_reference_template: "{doc}-{stla_id}"

# The document that owns the leaves. SXM sits in CFTS024's satellite chapters
# (§1.5.x) exactly as AMFM sits in its analog ones (§1.3.x).
spec_docs:
  primary: "CFTS024"
  external: {}
  docs: {}

# Spec worksheets a clause delegates its detail to; cited per batch as
# [[table:NAME]] in the batch table (same mechanism as AMFM).
# Workbook sync (framework Part IV): revision C has NO `Test Case Framework`
# sheet — verified 2026-08-10, 9 sheets — so the 14 Set names live in the
# per-row G/H columns only. Nothing to populate.
test_case_framework_sheet: false

spec_tables:
  seek_cancel_stop:
    source: "cip_radio_tables"
    sheet: "SEEK Cancel_Stop Transitions"
    header_rows: 2

workbook:
  # REVISION C LAYOUT — verified by probe against this file, not inherited.
  # The blank form's sheet is named 測試用例規範 (no "&Result"), and revision C
  # inserted Estimated Test Time at Q, shifting design_method, functional
  # safety, the vehicle block and author one column right of every A/B
  # instance in the repo (FORMS.md). No feature has shipped on this layout.
  sheet: "Test Case Specification 測試用例規範"
  header_row: 9
  columns:
    req_id: "D"
    tc_id: "F"
    test_group: "G"
    test_set: "H"
    test_item: "I"
    pre_conditions: "J"
    input_test_data: "K"
    test_procedure: "L"
    expected_result: "M"
    spec_reference: "N"
    tc_ref_id: "O"
    priority: "P"
    estimated_test_time: "Q"   # revision C only — absent from A/B instances
    design_method: "R"
    functional_safety: "S"
    author: "AA"
    remarks: "AH"

done_region:
  # BLANK workbook: there is no done region to protect. The selector is left
  # empty deliberately — a placeholder author value would silently match zero
  # rows and make an empty invariant look like a satisfied one.
  detection: "author"
  author_value: ""
  invariant: "content_hash"

write_back:
  author_value: "PeiPYHsu"
  tc_ref_id_value: "NEW"     # no legacy rows to inherit case from (cf. AMFM R13)
  fill_test_group_set: true  # canon §2 — true under BLANK

lint:
  design_method_source: "dropdown_sheet"   # exact-string vocabulary
  popup_ids: []                            # e.g. [PU0091, PU0942] — verbatim check
  extra_rules: []                          # feature-specific lint hooks
