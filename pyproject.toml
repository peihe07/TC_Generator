[project]
name = "tc-generator"
version = "0.1.0"
description = "Automated test case generation tool for ASPICE SWE.6"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50",
    "fastapi",
    "openpyxl",
    "pdfplumber",
    "python-multipart",
    "python-docx",
    "python-dotenv",
    "pyyaml",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.setuptools]
package-dir = {"" = "backend"}
py-modules = [
    "api_server",
    "generator",
    "grouper",
    "id_generator",
    "job_manager",
    "job_store",
    "main",
    "parser",
    "prompt_builder",
    "review_engine",
    "review_prompt_builder",
    "spec_matcher",
    "spec_parser",
    "validator",
    "writer",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
