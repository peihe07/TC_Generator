[project]
name = "tc-generator"
version = "0.1.0"
description = "Automated test case generation tool for ASPICE SWE.6"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "fastapi",
    "openpyxl",
    "pdfplumber",
    "python-multipart",
    "python-docx",
    "python-dotenv",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
