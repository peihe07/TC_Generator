<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:16px;">
  <div class="stack">
    <div class="row" style="align-items:flex-start;">
      <div>
        <div style="width:72px;height:28px;background:var(--win95-gray);border:2px solid;border-color:var(--win95-white) var(--win95-gray-mid) var(--win95-gray-mid) var(--win95-white);box-shadow:inset 1px 1px 0 var(--win95-gray-light), inset -1px -1px 0 var(--win95-gray-dark);"></div>
        <div class="meta" style="margin-top:4px;">Raised</div>
      </div>
      <div>
        <div style="width:72px;height:28px;background:#fff;border:2px solid;border-color:var(--win95-gray-dark) var(--win95-white) var(--win95-white) var(--win95-gray-dark);box-shadow:inset 1px 1px 0 #000;"></div>
        <div class="meta" style="margin-top:4px;">Sunken</div>
      </div>
      <div>
        <div style="width:72px;height:28px;background:var(--win95-gray);border:2px solid;border-color:var(--win95-gray-dark) var(--win95-white) var(--win95-white) var(--win95-gray-dark);box-shadow:inset 1px 1px 0 var(--win95-gray-dark);"></div>
        <div class="meta" style="margin-top:4px;">Pressed</div>
      </div>
      <div>
        <div style="width:92px;height:28px;background:#fff;padding:6px;box-shadow:2px 2px 0 rgba(0,0,0,0.15);border:2px solid;border-color:var(--win95-gray-dark) var(--win95-white) var(--win95-white) var(--win95-gray-dark);"></div>
        <div class="meta" style="margin-top:4px;">Paper card</div>
      </div>
      <div>
        <div style="width:72px;height:28px;background:var(--win95-gray);border:3px solid;border-color:var(--win95-white) var(--win95-gray-darker) var(--win95-gray-darker) var(--win95-white);box-shadow:4px 4px 0 rgba(0,0,0,0.35);"></div>
        <div class="meta" style="margin-top:4px;">Floating</div>
      </div>
    </div>
    <div class="meta">Five bezel vocabularies · all built from the seven-gray stack · zero rounded corners · no blur</div>
  </div>
</body></html>
