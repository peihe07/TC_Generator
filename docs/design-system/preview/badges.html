<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:16px;">
  <div class="stack">
    <div class="row">
      <span class="status-badge accepted">ACCEPTED</span>
      <span class="status-badge rejected">REJECTED</span>
      <span class="status-badge flagged">FLAGGED</span>
      <span class="status-badge pending">PENDING</span>
      <span class="status-badge reviewing">REVIEWING</span>
      <span class="status-badge generating">GENERATING…</span>
    </div>
    <div class="row" style="gap:6px;">
      <span style="font-family:Courier New,monospace;font-size:11px;background:#000080;color:#fff;padding:1px 6px;">TC-042</span>
      <span style="font-family:Courier New,monospace;font-size:11px;background:#fff;color:#000;padding:1px 6px;border:1px solid #000;">REQ-SYS-0117</span>
      <span style="font-family:Courier New,monospace;font-size:11px;background:#c0c0c0;color:#000;padding:1px 6px;border:1px solid #808080;">v3</span>
    </div>
    <div class="meta">Inset badge bezel (dark TL / light BR — opposite of a button) · mono ID chips stay sharp at 11px</div>
  </div>
</body></html>
