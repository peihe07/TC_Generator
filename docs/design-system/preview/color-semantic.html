<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:16px;">
  <div class="stack">
    <div class="row">
      <div class="swatch"><div class="swatch-chip" style="background:#00a000"></div><div class="swatch-label">Accept</div><div class="swatch-hex">#00a000</div></div>
      <div class="swatch"><div class="swatch-chip" style="background:#006400"></div><div class="swatch-label">Accept Dk</div><div class="swatch-hex">#006400</div></div>
      <div class="swatch"><div class="swatch-chip" style="background:#c4e9c4"></div><div class="swatch-label">Accept BG</div><div class="swatch-hex">#c4e9c4</div></div>
      <div class="swatch"><div class="swatch-chip" style="background:#c00000"></div><div class="swatch-label">Reject</div><div class="swatch-hex">#c00000</div></div>
      <div class="swatch"><div class="swatch-chip" style="background:#8b0000"></div><div class="swatch-label">Reject Dk</div><div class="swatch-hex">#8b0000</div></div>
      <div class="swatch"><div class="swatch-chip" style="background:#f5b7b7"></div><div class="swatch-label">Reject BG</div><div class="swatch-hex">#f5b7b7</div></div>
      <div class="swatch"><div class="swatch-chip" style="background:#e0a000"></div><div class="swatch-label">Warn</div><div class="swatch-hex">#e0a000</div></div>
      <div class="swatch"><div class="swatch-chip" style="background:#fb923c"></div><div class="swatch-label">Edit</div><div class="swatch-hex">#fb923c</div></div>
      <div class="swatch"><div class="swatch-chip" style="background:#fffbe0;outline:1px solid #ccc"></div><div class="swatch-label">Edit BG</div><div class="swatch-hex">#fffbe0</div></div>
    </div>
    <div class="meta">Each semantic ships a triad: bold fill + dark text + soft BG · orange reserved for "actively editing"</div>
  </div>
</body></html>
