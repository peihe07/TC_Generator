<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:16px;">
  <div class="stack">
    <div class="row">
      <button class="w95-btn">Cancel</button>
      <button class="w95-btn default">OK</button>
      <button class="w95-btn pressed">Pressed</button>
      <button class="w95-btn" disabled style="color:#808080;text-shadow:1px 1px 0 #fff;">Disabled</button>
    </div>
    <div class="row">
      <button class="w95-btn btn-accept">✓ Accept</button>
      <button class="w95-btn btn-reject">✗ Reject</button>
      <button class="w95-btn">✎ Edit</button>
      <button class="w95-btn">⟲ Regenerate</button>
    </div>
    <div class="meta">Min 28px height · bold border-bevel · default has extra inset outline · semantic text color only (no fills)</div>
  </div>
</body></html>
