<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:16px;">
  <div class="stack">
    <div class="row">
      <div class="swatch"><div class="swatch-chip" style="background:#000000"></div><div class="swatch-label">Black</div><div class="swatch-hex">#000000</div></div>
      <div class="swatch"><div class="swatch-chip" style="background:#404040"></div><div class="swatch-label">Gray Darker</div><div class="swatch-hex">#404040</div></div>
      <div class="swatch"><div class="swatch-chip" style="background:#606060"></div><div class="swatch-label">Gray Dark</div><div class="swatch-hex">#606060</div></div>
      <div class="swatch"><div class="swatch-chip" style="background:#808080"></div><div class="swatch-label">Gray Mid</div><div class="swatch-hex">#808080</div></div>
      <div class="swatch"><div class="swatch-chip" style="background:#c0c0c0;outline:1px solid #888"></div><div class="swatch-label">Gray ★</div><div class="swatch-hex">#c0c0c0</div></div>
      <div class="swatch"><div class="swatch-chip" style="background:#dfdfdf;outline:1px solid #aaa"></div><div class="swatch-label">Gray Light</div><div class="swatch-hex">#dfdfdf</div></div>
      <div class="swatch"><div class="swatch-chip" style="background:#ffffff;outline:1px solid #aaa"></div><div class="swatch-label">White</div><div class="swatch-hex">#ffffff</div></div>
    </div>
    <div class="meta">★ default surface — 80% of the UI · every 3D bezel is built from this stack</div>
  </div>
</body></html>
