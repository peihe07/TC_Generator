<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:16px;">
  <div class="stack">
    <div class="row">
      <div class="swatch"><div class="swatch-chip" style="background:#008080"></div><div class="swatch-label">Teal</div><div class="swatch-hex">#008080</div><div style="font-size:10px;color:#666;">desktop</div></div>
      <div class="swatch"><div class="swatch-chip" style="background:#000080"></div><div class="swatch-label">Navy</div><div class="swatch-hex">#000080</div><div style="font-size:10px;color:#666;">title / select</div></div>
      <div class="swatch"><div class="swatch-chip" style="background:#1084d0"></div><div class="swatch-label">Navy Light</div><div class="swatch-hex">#1084d0</div><div style="font-size:10px;color:#666;">gradient</div></div>
      <div class="swatch" style="width:auto;flex:1;min-width:140px;"><div class="swatch-chip" style="background:linear-gradient(to right,#000080,#1084d0);"></div><div class="swatch-label">Active title bar</div><div class="swatch-hex">navy → navy-light</div></div>
    </div>
    <div class="meta">Only three accent hues · teal ONLY on desktop wallpaper · navy for anything active/selected</div>
  </div>
</body></html>
