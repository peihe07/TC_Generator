<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TC Generator — Architecture Diagrams</title>
<style>
  :root {
    --bg:#fafaf7;
    --surface:#ffffff;
    --panel:#f4f2eb;
    --ink:#1a1a18;
    --muted:#6b6862;
    --line:#e2dfd5;
  }
  * { box-sizing:border-box; }
  body {
    max-width:760px;
    margin:0 auto;
    padding:56px 24px;
    color:var(--ink);
    background:var(--bg);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    line-height:1.55;
  }
  h1 { margin:0 0 8px; font-size:28px; }
  p { margin:0 0 16px; color:var(--muted); }
  .panel {
    margin-top:28px;
    padding:22px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--surface);
  }
  code {
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:1px 5px;
  }
  a { color:var(--ink); text-decoration:none; border-bottom:1px solid var(--line); }
</style>
</head>
<body>
  <h1>TC Generator — Architecture Diagrams</h1>
  <p>更新：2026-04-27</p>
  <div class="panel">
    <p>目前 diagram 的 canonical 版本在 app 靜態頁：</p>
    <p><code>frontend/public/diagrams.html</code></p>
    <p>這份 docs 入口保留給文件索引使用，避免同時維護兩份流程圖造成 Upload / Configure / Export 行為描述不一致。</p>
  </div>
</body>
</html>
