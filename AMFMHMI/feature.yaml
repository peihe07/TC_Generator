# feature.yaml — pipeline configuration for AMFM
# All feature-specific constants live HERE; shared scripts read this file
# and contain no per-feature literals. Regenerate nothing by editing code.

feature: "AMFM"
test_group: "AMFM"          # framework-internal; workbook write per profile

paths:
  workbook: "inputs/FM-WI-FSM-036-A01 STLA 測試用例規範與結果_SWQT STLA Test Case Specification & Result_SWQT_CFTS024_Radio_20260129.xlsx"
  # RULING R1 (Pei, 2026-08-09) — OVERRIDES the workbook Scope arbitration.
  # intake.py proposed inputs/FM-WI-SW-RAD-SWRA-A02.xlsx because the workbook's
  # Scope field still names it; R1 rules that field stale (RULINGS.md C1, the
  # same defect class as Home A-H26) and makes the 037-A03 the requirement
  # basis: 102 leaves, SWE-RA-RAD-*, sources = SYSAD components.
  a03_report: "inputs/SWE1_AMFM_FM-WI-FSM-037-A03 STLA 報告_SWRA STLA Report_SWRA_20260323.xlsx"
  # Superseded requirement report under R1 (57 leaves, SWE-RAD-*, carries the
  # only ASIL/FTTI columns in the corpus). NOT the TC source, but declared so
  # recon hashes it: RULINGS C2a/C3a are argued from its contents, and an
  # un-hashed input is one nobody can prove they surveyed.
  swra_a02_report: "inputs/FM-WI-SW-RAD-SWRA-A02.xlsx"
  # intake.py filed the SYS2 safety-analysis report here because it is a
  # Polarion export; it is NOT a spec-text export (mode A's role for this key).
  # Recorded below as sysra_export instead.
  sys1_export: null
  spec_pdf: null            # mode D: the spec is a Word document, not a PDF
  popup_list: null          # no Pop Up List in this corpus
  # Mode D spec source. No pipeline script consumes this key yet — recorded
  # here so the input is on the record and the gap is visible (Phase 3 item:
  # spec_reference format for mode D).
  cfts_doc: "inputs/R1LR_Atl-H_25PI3.5_Multimedia - Radio and Audio_CFTS 024_Specific HU Radio Functions_20250910_1239.docx"
  # Safety-analysis layer. In the trace chain only if the ruled requirement
  # source carries a safety attribute — recon answers this.
  # Companion workbook several CFTS clauses delegate detail to (state tables,
  # PI seek ordering, preset defaults). Same 25PI3.5 release as CFTS024.
  cip_radio_tables: "inputs/CIP_Radio_Tables_v6.7.xlsx"
  sysra_export: "inputs/SYS2_CFTS024_Tuner_FM-WI-FSM-035-A02 STLA 技術安全需求分析報告_SYSRA STLA Technical Safety Requirement Analysis Report_SYSRA_CFTS024_Tuner_V01.xlsx"

spec_mode: "D"        # A/B/C/D/E per FEATURE_ONBOARDING §3
# R7-Q3 (Pei, 2026-08-09): per-source doc + STLA id from the 037 title tail.
# {doc} in {CFTS024, CFTS011, CFTS004} per framework Part III allocation.
spec_reference_template: "{doc}-{stla_id}"

# R7-Q3 allocation. `primary` is the doc whose headings carry the anchors the
# bracket map reads; `external` lists the leaves ruled to other CFTS documents
# (A-AM06 evidenced by SYS3 §4.4.2 c.3; A-AM07 inferred, marked in reasoning).
# build_stla_map.py cross-checks this list against the leaves whose STLA id
# falls outside the primary document's anchor range — the two must agree.
# R9 (Pei, 2026-08-10) — declared-id corrections. The STLA id is a hand-typed
# tail on the 037 title, so it can name the wrong clause while resolving
# perfectly (A-AM08). An override is a RULED correction of the upstream
# document, never a pipeline guess: each entry carries the ruling and the
# evidence, and build_stla_map.py refuses an override that is not an
# improvement on what the declared id resolves to.
stla_id_overrides:
  SWE-RA-RAD-029:
    declared: 4872451
    corrected: 4872457
    ruling: "R9"
    reason: >-
      029's title is the verbatim body of clause 4872457 (Tune by Direct
      Number Input, §1.3.6) minus the VR wording the 037 systematically
      omits — similarity 0.909, against 0.036 for the declared 4872451,
      which is the ICS tune-down clause correctly owned by 028.

# Spec worksheets a CFTS clause delegates its detail to. A batch cites one by
# writing `[[table:NAME]]` in its row of docs/batches-amfm.md; the context
# builder then injects the sheet as rows. `header_rows` > 1 means the column
# labels sit under a merged banner row, which is forward-filled so a lone
# label does not lose its group.
spec_tables:
  seek_cancel_stop:
    source: "cip_radio_tables"
    sheet: "SEEK Cancel_Stop Transitions"
    header_rows: 2
  pi_seek_ordering:
    source: "cip_radio_tables"
    sheet: "PI Seek Ordering"
    header_rows: 1

spec_docs:
  primary: "CFTS024"
  external:
    CFTS011: "087, 089-096"
    CFTS004: "097-104"

workbook:
  sheet: "Test Case Specification&Result"
  header_row: 9
  # column letters, verified by recon header match — do not guess
  columns:
    req_id: "D"
    test_group: "G"
    test_set: "H"
    test_item: "I"
    pre_conditions: "J"
    input_test_data: "K"
    test_procedure: "L"
    expected_result: "M"
    spec_reference: "N"
    tc_ref_id: "O"
    priority: "P"
    design_method: "Q"
    functional_safety: "R"
    author: "Z"
    remarks: "AG"      # recon-verified against header text (was AH, a Media
                       # prior; A-AM05 sign-off 2026-08-09)

done_region:
  # detection: "author" (author-cell match) or "rows" (explicit ranges)
  detection: "author"
  # R3 (Pei, 2026-08-09): C2a = option (i). 'Wilson' selects the FROZEN
  # LEGACY region (158 rows, SWE-RAD-* family), excluded from coverage
  # invariants — NOT a protected done region in the Home sense. Style may
  # be borrowed from these rows; traceability may not. Authorship ruling:
  # rows fully quoted from others keep the original author's name.
  author_value: "Wilson"
  # invariant: "content_hash" (interleaved-safe) or "positional"
  invariant: "content_hash"

write_back:
  # R裁決1 (Pei, 2026-08-09): rows Pei generates → PeiPYHsu; rows fully
  # quoted from another author keep that author's name.
  author_value: "PeiPYHsu"
  tc_ref_id_value: "NEW"
  # R7-Q1/Q2 + DECISIONS §4 (match done-region convention = columns FILLED):
  # new rows write Test Group = AMFM, Test Set = capability value from
  # framework Part III. Legacy rows keep Radio + band scheme, frozen.
  fill_test_group_set: true
  # A-AM01 / RULINGS C1: Scope field is stale (names SWRA-A02); corrected
  # at write-back by label text, exactly as Home A-H26.
  scope_label: "範圍 Scope"
  scope_source: "a03_report"

lint:
  design_method_source: "dropdown_sheet"   # exact-string vocabulary
  popup_ids: []                            # e.g. [PU0091, PU0942] — verbatim check
  extra_rules: []                          # feature-specific lint hooks
